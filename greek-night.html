<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Greek Night</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-polylineoffset/1.1.1/leaflet.polylineoffset.js"></script>
<style>
  :root{
    --bg:#0b0d10; --card:#14181d; --card2:#1b2127; --line:#262d35;
    --ink:#f2f4f6; --ink2:#a9b2bc; --ink3:#6b7682;
    --accent:#f5b84a; --ok:#4fd18b; --now:#5aa9ff;
    --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem;
    --r:1rem; --r2:.6rem;
    --t1:1.6rem; --t2:1.05rem; --t3:.92rem; --t4:.78rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:max(var(--s4),env(safe-area-inset-top)) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom))}
  header{padding:0 0 var(--s3)}
  header h1{font-size:var(--t1);letter-spacing:-.02em;font-weight:700}
  header p{color:var(--ink2);font-size:var(--t3);margin-top:var(--s1)}
  .meta{display:flex;gap:var(--s2);flex-wrap:nowrap;margin-top:var(--s2);min-width:0}
  .meta .chip{flex:none;white-space:nowrap;padding:var(--s1) var(--s2)}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:var(--s1) var(--s3);font-size:var(--t4);color:var(--ink2)}
  .chip b{color:var(--ink);font-weight:600}
  .chip.now{border-color:var(--now);color:var(--now)}
  section{margin-top:var(--s5)}
  section h2{font-size:var(--t4);text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:var(--s3);display:flex;justify-content:space-between;align-items:baseline}
  section h2 span{letter-spacing:0;text-transform:none;color:var(--ink3)}
  .list{display:flex;flex-direction:column;gap:var(--s2)}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s3) var(--s3) var(--s3);position:relative;transition:opacity .2s}
  .item.now,.item.linked{border-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
  .item.done,.item.past{opacity:.42}
  .earlier{font-size:var(--t4);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-top:var(--s3)}
  .item.done .title{text-decoration:line-through}
  .check{appearance:none;-webkit-appearance:none;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--ink3);margin-top:.1rem;flex:none;display:grid;place-items:center;cursor:pointer}
  .check:checked{background:var(--ok);border-color:var(--ok)}
  .check:checked::after{content:"";width:.5rem;height:.85rem;border:solid #0b0d10;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-10%,-15%)}
  .check.num::after{content:attr(data-n);font-size:var(--t4);font-weight:700;line-height:1;color:var(--ink2);font-variant-numeric:tabular-nums}
  .check.num.key-now::after{color:var(--now)}
  .check.num.key-acc::after{color:var(--accent)}
  .check.num:checked::after{content:attr(data-n);width:auto;height:auto;border:0;transform:none;color:#0b0d10}
  .body{min-width:0}
  .time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:var(--t4);letter-spacing:.04em}
  .item.now .time,.item.linked .time{color:var(--now)}
  .title{font-size:var(--t2);font-weight:600;margin-top:.1rem}
  .note{color:var(--ink2);font-size:var(--t3);margin-top:var(--s1)}
  .next{font-size:var(--t4);font-weight:600;margin-top:var(--s1)}
  .next:empty{display:none}
  .map{flex:none;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:var(--r2);background:var(--card2);border:1px solid var(--line);text-decoration:none;font-size:1.1rem;margin-top:.05rem;color:var(--ink2)}
  .map:active{background:var(--line)}
  .side{display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
  .skipbtn{flex:none;padding:var(--s1) var(--s2);font-size:var(--t4);border-radius:999px;line-height:1.2;cursor:pointer}
  .item.skipped{opacity:.42}
  .item.skipped .title{text-decoration:line-through}
  .bring .item{grid-template-columns:auto 1fr}
  .bring .title{font-size:var(--t3);font-weight:500;margin-top:.15rem}
  .actions{display:flex;gap:var(--s2);margin-top:var(--s5)}
  button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r2);padding:var(--s3);font:inherit;font-size:var(--t3)}
  footer{margin-top:var(--s6);text-align:center;color:var(--ink3);font-size:var(--t4)}
  .mapcard{position:relative;width:100%;aspect-ratio:4/3;max-height:60vh;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  @media (max-width:767px){.mapcard{aspect-ratio:auto;max-height:none;height:42vh;height:42dvh}}
  #gnmap{position:absolute;inset:0;background:#e9e5dc;font:inherit}
  .leaflet-container{font-family:inherit}
  .leaflet-tile-pane{filter:saturate(.55) brightness(1.06)}   /* a light wash on the basemap; the route, pins and dot sit in sibling panes, unfiltered */
  .leaflet-control-attribution{font-size:9px;line-height:1.2;padding:1px 4px;background:rgba(255,255,255,.7);color:#6f6a5f}
  .leaflet-control-attribution a{color:#6f6a5f}
  /* pins: a numbered circle; a ring pulses on the current step; done steps fade */
  .pinm{width:28px;height:28px;border-radius:50%;background:var(--now);border:2px solid #fff;color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:opacity .2s}
  .pinm.greek{background:var(--accent);color:#0b0d10}
  .pinm.start{width:24px;height:24px;background:var(--ink3);font-size:11px}
  .item .pmark{width:1.6rem;height:1.6rem;border-radius:50%;background:var(--ink3);color:#fff;font-weight:700;font-size:var(--t4);display:grid;place-items:center;margin-top:.1rem;flex:none}
  .pinm.two{font-size:9px;letter-spacing:-.03em}
  .pinm.done{opacity:.45}
  .pinm.now::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--now);animation:gnPulse 2s ease-out infinite}
  @keyframes gnPulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
  @media (prefers-reduced-motion:reduce){.pinm.now::after{animation:none;transform:scale(1.5);opacity:.6}}
  .pinlbl{background:none;border:0;box-shadow:none;padding:0 4px;font-size:8pt;font-weight:600;color:#6f6a5f;text-shadow:-1px 0 #fff,1px 0 #fff,0 -1px #fff,0 1px #fff,0 0 2px #fff;white-space:nowrap}
  .pinlbl::before{display:none}
  .pp-dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.35rem;vertical-align:.05em}
  /* the pin popup: the page's dark pill; the whole card is the Apple Maps link */
  .pinpop .leaflet-popup-content-wrapper{background:var(--card2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 26px rgba(0,0,0,.45);color:var(--ink);padding:0}
  .pinpop .leaflet-popup-content{margin:var(--s2) var(--s3);font-size:var(--t4);line-height:1.35}
  .pinpop .leaflet-popup-tip{background:var(--card2);border:1px solid var(--line);border-top:0;border-left:0}
  .pinpop .pp{display:flex;align-items:center;gap:var(--s2);color:inherit;text-decoration:none}
  .pinpop .pp-t{flex:1;min-width:0}
  .pinpop b{display:block;font-size:var(--t3);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinpop .pp-m{display:block;margin-top:2px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .pinpop .pp-c{flex:none;font-size:1.4rem;line-height:1;color:var(--ink3)}
  #next{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}   /* the one chip that gives way */
  #clock .sub{color:var(--ink2)}
  #clock .sub[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>Greek Night</h1>
  <p>Jack Johnson + G. Love · Thu Oct 1 2026 · Berkeley · v1.04</p>
  <div class="meta">
    <span class="chip now" id="clock"><span id="clocktime">—</span><span class="sub" id="clocksub" hidden></span></span>
    <span class="chip" id="next"></span>
  </div>
</header>

<div class="mapcard" id="mapcard">
  <div id="gnmap" role="img" aria-label="Route map"></div>
</div>

<section>
  <h2>Plan <span id="progress"></span></h2>
  <div class="list" id="plan"></div>
</section>

<section class="bring">
  <h2>Bring</h2>
  <div class="list" id="bring"></div>
</section>

<div class="actions">
  <button id="reset">Reset checks</button>
</div>

<footer>Greek Night · v1.04 · 238fa1e</footer>

<script>
(function(){
  'use strict';
  var M = function(q){ return 'https://maps.apple.com/?q=' + encodeURIComponent(q); };

  var GARAGE_MAP = M('Center Street Parking Garage 2025 Center St Berkeley');
  var PLAN = [
    {t:'2:55', h:14, m:55, title:'Doe Library', note:'Through the west gate, straight ahead. No ID needed. North Reading Room (the vaulted one, green lamps) and Morrison Library (wood-panelled, couches, records) — both just inside the entrance. 40 min, no clock.', map:M('Doe Memorial Library UC Berkeley')},
    {t:'3:35', h:15, m:35, title:'Campanile — up', note:'$6, card only, open till 5. Ride up, 15 min on the deck: the bay, both bridges, the Greek below you.', map:M('Sather Tower UC Berkeley')},
    {t:'3:55', h:15, m:55, title:'Faculty Glade', note:'Behind the tower toward College: quiet lawn under old oaks, redwoods, Strawberry Creek running through. Sit 15.', map:M('Faculty Glade UC Berkeley')},
    {t:'4:10', h:16, m:10, title:'Caffe Strada', note:'Out the SE corner (Bancroft & College). The patio under the trees. Tea.', map:M('Caffe Strada 2300 College Ave Berkeley')},
    {t:'4:25', h:16, m:25, title:'Telegraph Ave', note:'West on Bancroft, south on Telegraph. Moe’s Books (four floors, used) and Amoeba next door. 20 min.', map:M('Moe’s Books 2476 Telegraph Ave Berkeley')},
    {t:'4:50', h:16, m:50, title:'Berkeley City Club', note:'North to Durant, two blocks west. Julia Morgan, 1929 — Moorish lobby, courtyard, the indoor pool. Julia’s is 2nd floor.', map:M('Berkeley City Club 2315 Durant Ave Berkeley')},
    {t:'5:00', h:17, m:0, title:'Dinner — Julia’s', note:'Table for 2. Zero-proof cocktails. Niçoise w/ trout, ratatouille, beet salad. Ask for the check by 6:10.', map:M('Julia’s Restaurant 2315 Durant Ave Berkeley')},
    {t:'6:15', h:18, m:15, title:'Walk to the Greek', note:'Durant east → College Ave north → Gayley Rd. 15 min, uphill at the end.', map:M('Greek Theatre 2001 Gayley Rd Berkeley')},
    {t:'6:35', h:18, m:35, title:'In the gate', note:'G. Love on. Jack ~8:00. Done ~10:15. GA pit — standing, front of stage. Water refill on the middle concourse.', map:M('Greek Theatre 2001 Gayley Rd Berkeley')},
    {t:'10:15', h:22, m:15, title:'Back to the car', note:'Out the north side: Gayley → Hearst west → Oxford south → Center. 20 min downhill, clear of the Gayley crowd.', map:GARAGE_MAP}
  ];
  /* the garage: an unnumbered start pin (ord 0, lettered P) that the walk back also ends at */
  var START = {n:'Center St Garage', lat:37.8706, lng:-122.2684, steps:[], ord:0, start:true, letter:'P', map:GARAGE_MAP,
               t:'2:40', note:'2025 Center St, enter from Center. $25 for the day, exit by 1 am. 20 EV spots — plug in.'};

  var BRING = [
    'Hoodie / jacket — mid-50s after dark',
    'Comfortable shoes — pit is standing, 6:30 to 10:15',
    'Small blanket (under 40×60) — only if you want the lawn for the back half',
    'Empty water bottle',
    'Small bag only — no bag check, everything searched',
    'Sunscreen for 5–7pm, bowl faces west',
    'Phone charged · Clipper in Wallet · tickets in Wallet'
  ];

  var KEY = 'greek-night-v4';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var planEl = document.getElementById('plan');
  var bringEl = document.getElementById('bring');
  var progEl = document.getElementById('progress');
  var clockTimeEl = document.getElementById('clocktime');
  var clockSubEl = document.getElementById('clocksub');

  function row(id, time, title, note, map){
    var el = document.createElement('label');
    el.className = 'item';
    el.dataset.id = id;
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'check'; cb.checked = !!state[id];
    if (id.charAt(0) === 'p') { cb.classList.add('num'); cb.setAttribute('data-n', +id.slice(1) + 1); }
    cb.addEventListener('change', function(){ state[id] = cb.checked; save(); paint(); });
    var body = document.createElement('div'); body.className = 'body';
    if (time) { var tt = document.createElement('div'); tt.className = 'time'; tt.textContent = time; body.appendChild(tt); }
    var ti = document.createElement('div'); ti.className = 'title'; ti.textContent = title; body.appendChild(ti);
    if (note) { var nn = document.createElement('div'); nn.className = 'note'; nn.textContent = note; body.appendChild(nn); }
    if (id.charAt(0) === 'p') { var nx = document.createElement('div'); nx.className = 'next'; body.appendChild(nx); }
    el.appendChild(cb); el.appendChild(body);
    if (map) {
      var a = document.createElement('a'); a.className = 'map'; a.href = map; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↗'; a.setAttribute('aria-label', 'Apple Maps');
      a.addEventListener('click', function(ev){ ev.stopPropagation(); });
      el.appendChild(a);
    }
    return el;
  }

  /* the parking row: first, no number, no tick, never moves; its walk line and highlight come off the start pin */
  var parkEl = row('garage', START.t, START.n, START.note, START.map);
  var pm = document.createElement('span'); pm.className = 'pmark'; pm.textContent = START.letter;
  parkEl.replaceChild(pm, parkEl.querySelector('.check'));
  var pnx = document.createElement('div'); pnx.className = 'next'; parkEl.querySelector('.body').appendChild(pnx);
  planEl.appendChild(parkEl);
  var rowEls = PLAN.map(function(p, i){ return planEl.appendChild(row('p' + i, p.t, p.title, p.note, p.map)); });   /* by step; the list itself reorders */
  BRING.forEach(function(b, i){ bringEl.appendChild(row('b' + i, '', b, '', '')); });

  /* steps 1–6 can be skipped: a chip under the ↗ button; the row's right column stacks the two */
  function isSkipped(step){ return !!(state.skip && state.skip['p' + (step - 1)]); }
  function skipGain(i){ return (PLAN[i + 1].h * 60 + PLAN[i + 1].m) - (PLAN[i].h * 60 + PLAN[i].m); }
  [1, 2, 3, 4, 5, 6].forEach(function(step){
    var r = rowEls[step - 1], a = r.querySelector('.map');
    var side = document.createElement('div'); side.className = 'side';
    r.replaceChild(side, a); side.appendChild(a);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip skipbtn'; b.textContent = 'Skip';
    b.addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var id = 'p' + (step - 1);
      state.skip = state.skip || {};
      if (state.skip[id]) delete state.skip[id]; else state.skip[id] = true;
      save(); popClose(); buildMap(); paint();
    });
    side.appendChild(b);
  });

  /* Each step's place in the evening (on Oct 1; any other day nothing is under way):
     done = ticked or skipped; past = its next step started more than 15 min ago (the last step: an hour after its own time);
     current = the first step that has started and is neither; everything else is still to come. */
  function minsNow(){
    var d = new Date();
    return d.getMonth() === 9 && d.getDate() === 1 ? d.getHours() * 60 + d.getMinutes() : -1;
  }
  function planStates(){
    var now = minsNow(), cur = -1;
    var st = PLAN.map(function(p, i){
      if (state['p' + i] || isSkipped(i + 1)) return 'done';
      if (now < 0) return 'up';
      var start = p.h * 60 + p.m, nx = PLAN[i + 1], end = nx ? nx.h * 60 + nx.m + 15 : start + 60;
      if (now > end) return 'past';
      if (now >= start && cur < 0) { cur = i; return 'cur'; }
      return 'up';
    });
    return {st:st, cur:cur};
  }
  /* current first, then what's still to come in time order; under "Earlier", what's behind you in plan order.
     A row that moves slides to its new place (FLIP, 250 ms) rather than jumping; the first paint just sets the order. */
  var earlierEl = document.createElement('div'), firstOrder = true;
  earlierEl.className = 'earlier'; earlierEl.textContent = 'Earlier';
  function reorder(ps){
    var top = [], back = [];
    if (ps.cur >= 0) top.push(rowEls[ps.cur]);
    rowEls.forEach(function(r, i){ if (ps.st[i] === 'up') top.push(r); });
    rowEls.forEach(function(r, i){ if (ps.st[i] === 'past' || ps.st[i] === 'done') back.push(r); });
    var seq = [parkEl].concat(back.length ? top.concat([earlierEl], back) : top);
    var have = Array.prototype.slice.call(planEl.children);
    if (have.length === seq.length && have.every(function(e, i){ return e === seq[i]; })) return;
    var was = have.map(function(e){ return e.getBoundingClientRect().top; });
    seq.forEach(function(e){ planEl.appendChild(e); });
    if (!back.length && earlierEl.parentNode) planEl.removeChild(earlierEl);
    var animate = !firstOrder && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    firstOrder = false;
    if (!animate) return;
    var moved = [];
    have.forEach(function(e, k){
      if (!e.parentNode) return;
      var d = was[k] - e.getBoundingClientRect().top;
      if (Math.abs(d) < 1) return;
      e.style.transition = 'none'; e.style.transform = 'translateY(' + d + 'px)'; moved.push(e);
    });
    if (!moved.length) return;
    void planEl.offsetHeight;   /* commit the old positions before playing to the new ones */
    moved.forEach(function(e){ e.style.transition = 'transform .25s ease'; e.style.transform = ''; });
    setTimeout(function(){ moved.forEach(function(e){ e.style.transition = ''; }); }, 300);
  }

  function paint(){
    var done = 0, skipped = 0, ps = planStates();
    rowEls.forEach(function(r, i){
      var checked = !!state['p' + i], sk = isSkipped(i + 1);
      r.classList.toggle('done', checked);
      r.classList.toggle('skipped', sk);
      r.classList.toggle('past', ps.st[i] === 'past');
      r.classList.toggle('now', i === ps.cur);
      var note = r.querySelector('.note'), btn = r.querySelector('.skipbtn');
      if (note) note.textContent = sk ? 'Skipped · +' + skipGain(i) + ' min' : PLAN[i].note;
      if (btn) btn.textContent = sk ? 'Restore' : 'Skip';
      var nx = r.querySelector('.next'), wl = sk ? null : walkNext(i + 1);
      if (nx) { nx.textContent = wl ? wl.txt : ''; nx.style.color = wl ? wl.col : ''; }
      if (sk) skipped++; else if (checked) done++;
    });
    var pl = LEGS.filter(function(l){ return l.a === START; })[0];
    pnx.textContent = pl ? '→ ' + pl.b.n + ' · ' + pl.min + ' min walk' : ''; pnx.style.color = pl ? pl.col : '';
    reorder(ps);
    /* now / next: the current step, else the first still to come; before the garage, the garage */
    var now = minsNow(), nextEl = document.getElementById('next');
    if (ps.cur >= 0) nextEl.textContent = 'Now · ' + PLAN[ps.cur].title;
    else if (now < 0 || now < 14 * 60 + 40) nextEl.textContent = 'Next · ' + START.n + ' · ' + START.t;
    else {
      var up = ps.st.indexOf('up');
      nextEl.textContent = up >= 0 ? 'Next · ' + PLAN[up].title + ' · ' + PLAN[up].t : 'Done';
    }
    var brows = bringEl.children;
    for (var j = 0; j < brows.length; j++) brows[j].classList.toggle('done', !!state['b' + j]);
    progEl.textContent = done + ' / ' + (PLAN.length - skipped);
    var d = new Date();
    var hh = d.getHours() % 12 || 12, mm = ('0' + d.getMinutes()).slice(-2);
    clockTimeEl.textContent = hh + ':' + mm + (d.getHours() < 12 ? ' am' : ' pm');
    paintMap(ps.cur);
  }

  /* the walk on from a step's stop, off the live legs: the stop's last step gets its outbound leg (the Greek gets the walk
     back); an earlier step at a shared stop just points at the next step there */
  function walkNext(k){
    var pin = PLACES.filter(function(s){ return s.steps.indexOf(k) >= 0; })[0];
    if (!pin) return null;
    var ls = liveSteps(pin);
    if (k !== ls[ls.length - 1]) return {txt:'→ ' + PLAN[ls[ls.indexOf(k) + 1] - 1].title + ' · same building', col:''};
    var l = LEGS.filter(function(l){ return l.a === pin; })[0];
    if (!l) return null;
    return {txt:'→ ' + l.b.n + ' · ' + l.min + ' min walk' + (l.b.greek ? ', uphill' : ''), col:l.col};
  }

  /* ---------- the route: pins, legs, bypasses ---------- */
  var SHARED = [
    {n:'Doe Library', lat:37.8723, lng:-122.2592, steps:[1]},
    {n:'Campanile', lat:37.8721, lng:-122.2578, steps:[2]},
    {n:'Faculty Glade', lat:37.8711, lng:-122.2562, steps:[3]},
    {n:'Caffe Strada', lat:37.8688, lng:-122.2533, steps:[4]},
    {n:'Moe’s / Amoeba', lat:37.8657, lng:-122.2587, steps:[5]},
    {n:'Berkeley City Club', lat:37.8678, lng:-122.2612, steps:[6, 7]},
    {n:'Greek Theatre', lat:37.8737, lng:-122.2543, steps:[9], greek:true}
  ];
  SHARED.forEach(function(s){ s.ord = s.steps[0]; });
  var PLACES = [START].concat(SHARED);
  var BACK = [[37.8737, -122.2543], [37.8747, -122.2545], [37.8749, -122.2604], [37.8747, -122.2662], [37.8706, -122.2684]];   /* Greek → Hearst → Oxford → the garage */
  /* walk out, as legs between pins: the waypoints between the two; the Bancroft & College retrace is the same sidewalk */
  var LEG_WP = {
    'S-1': [[37.8702, -122.2662], [37.8718, -122.2640]],
    '1-2': [],
    '2-3': [],
    '3-4': [[37.8700, -122.2555], [37.8687, -122.2535]],
    '4-5': [[37.8687, -122.2588]],
    '5-6': [[37.8677, -122.2588]],
    '6-9': [[37.8677, -122.2535], [37.8687, -122.2535], [37.8705, -122.2545]]
  };
  /* a skipped pin's two legs splice into one: the waypoints from the previous pin to the next; adjacent skips chain in order */
  var BYPASS = {
    1: [[37.8702, -122.2662], [37.8718, -122.2640], [37.8723, -122.2592]],
    2: [],
    3: [[37.8700, -122.2555], [37.8687, -122.2535]],
    4: [[37.8700, -122.2555], [37.8687, -122.2535], [37.8687, -122.2588]],
    5: [[37.8687, -122.2588], [37.8687, -122.2612]],
    6: [[37.8677, -122.2588], [37.8677, -122.2535], [37.8687, -122.2535], [37.8705, -122.2545]]
  };
  /* a better walk than the chained bypasses, from one pin to a later one with everything between skipped:
     Campanile → Sather Gate → Telegraph when the Glade and Strada are skipped. Used inside a chain too. */
  var GAP_OVERRIDE = {'2-5': [[37.8703, -122.2595], [37.8687, -122.2588]]};
  /* one colour per leg, keyed by the pin it starts from (S = the start pin); a leg spliced by a skip takes the colour of the leg it starts with */
  var LEG_COLOURS = {'S-1':'#3b82f6', '1-2':'#a855f7', '2-3':'#0ea5e9', '3-4':'#14b8a6', '4-5':'#22c55e', '5-6':'#f59e0b', '6-9':'#ec4899', 'ret':'#6b7682'};
  function kid(s){ return s.start ? 'S' : String(s.steps[0]); }   /* a pin's key in the leg tables */
  function legColour(fromKey){
    for (var k in LEG_COLOURS) if (k.split('-')[0] === fromKey) return LEG_COLOURS[k];
    return LEG_COLOURS.ret;
  }
  /* a pin stays while any of its steps is live: skip 6 and City Club remains for dinner, reading 7. The start pin always stays. */
  function liveSteps(s){ return s.steps.filter(function(k){ return !isSkipped(k); }); }
  function livePlaces(){ return PLACES.filter(function(s){ return s.start || liveSteps(s).length > 0; }); }
  /* walk time per leg: haversine along the waypoints, 3 mph (20 min/mile); the climb to the Greek at 2.5 mph */
  function metres(a, b){
    var R = 6371000, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dg = (b[1] - a[1]) * r;
    var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dg / 2) * Math.sin(dg / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function walkLegs(){
    var live = livePlaces(), legs = [];   /* the walk out */
    for (var i = 1; i < live.length; i++) {
      var a = live[i - 1], b = live[i], pts = [[a.lat, a.lng]];
      var key = kid(a) + '-' + kid(b);
      var gap = SHARED.filter(function(s){ return s.ord > a.ord && s.ord < b.ord; });   /* the skipped pins between them, in order */
      if (!gap.length) pts = pts.concat(LEG_WP[key] || []);
      /* through the skipped run: at each skipped pin, the longest override from the pin before it, else its bypass */
      for (var g = 0; g < gap.length;) {
        var from = g ? kid(gap[g - 1]) : kid(a), j = gap.length;
        for (; j > g; j--) if (GAP_OVERRIDE[from + '-' + kid(j < gap.length ? gap[j] : b)]) break;
        if (j > g) { pts = pts.concat(GAP_OVERRIDE[from + '-' + kid(j < gap.length ? gap[j] : b)]); g = j; }
        else { pts = pts.concat(BYPASS[gap[g].ord]); g++; }
      }
      pts.push([b.lat, b.lng]);
      /* named by the steps at each end (the start pin by its letter); the climb to the Greek is step 8, so it carries just that */
      legs.push({pts:pts, mph:b.greek ? 2.5 : 3, a:a, b:b, col:legColour(kid(a)),
                 name:b.greek ? '8' : (a.start ? a.letter : liveSteps(a)[0]) + '→' + liveSteps(b)[0]});
    }
    /* the walk back out: Greek → the car */
    var greek = PLACES.filter(function(s){ return s.greek; })[0];
    legs.push({pts:BACK, mph:3, ret:true, a:greek, b:START, col:LEG_COLOURS.ret, name:'9→P'});
    legs.forEach(function(l){
      var m = 0;
      for (var j = 1; j < l.pts.length; j++) m += metres(l.pts[j - 1], l.pts[j]);
      l.min = Math.round(m / 1609.344 / l.mph * 60);
    });
    return legs;
  }
  var LEGS = [];
  function routeData(){ LEGS = walkLegs(); }
  var K = Math.cos(37.87 * Math.PI / 180);
  /* plan rows with a pin take the pin's colour for their step number */
  PLACES.forEach(function(s){ s.steps.forEach(function(k){ rowEls[k - 1].querySelector('.check').classList.add(s.greek ? 'key-acc' : 'key-now'); }); });

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function popPill(href, name, lines){
    return '<a class="pp" href="' + esc(href) + '" target="_blank" rel="noopener"><span class="pp-t"><b>' + name + '</b>' +
      lines.map(function(l){ return '<span class="pp-m">' + l + '</span>'; }).join('') + '</span><span class="pp-c">›</span></a>';
  }
  /* ---------- the map: Leaflet on OpenStreetMap tiles. Legs, pins and pills are a layer group rebuilt from the live
     pin list; Leaflet does the projection, the gestures, the labels and the popup. ---------- */
  var cardEl = document.getElementById('mapcard'), linkedRows = [], markers = [];
  var NOW = '#5aa9ff', ACCENT = '#f5b84a';   /* --now and --accent, for SVG paths that can't read CSS variables */
  var map = L.map('gnmap', {zoomControl:false, minZoom:14, maxZoom:17, attributionControl:true, zoomSnap:0, doubleClickZoom:false});   /* zoomSnap 0: the fit lands on the route exactly, not the next whole level out */
  map.attributionControl.setPrefix('');
  L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {subdomains:'abc', minZoom:14, maxZoom:17, attribution:'© OpenStreetMap contributors, Humanitarian OSM Team'}).addTo(map);
  var routeLayer = L.layerGroup().addTo(map), meLayer = L.layerGroup().addTo(map);
  var meDot = null, meRing = null;
  var hasOffset = !!(window.L && L.PolylineOffset);   /* leaflet-polylineoffset: a shared street draws its two legs ±4px apart */

  /* Shared streets: where two legs run along the same stretch they're drawn side by side. In local metres: split any
     segment where another leg's segment runs along it (under 8° apart, within 3 m), at the overlap's ends; a split segment
     whose ends match another leg's that way is shared, and each sharer takes a side. A leg comes out as parts: runs of
     segments with the same side, each its own polyline. */
  function legParts(legs){
    var TOL = 3, PAR = 0.14, MX = K * 111320, MY = 111320;
    function M(c){ return [c[1] * MX, c[0] * MY]; }
    function LL(p){ return [p[1] / MY, p[0] / MX]; }
    function sub(a, b){ return [a[0] - b[0], a[1] - b[1]]; }
    function dot(a, b){ return a[0] * b[0] + a[1] * b[1]; }
    function unit(a, b){ var d = sub(b, a), L = Math.hypot(d[0], d[1]) || 1; return [d[0] / L, d[1] / L]; }
    function along(a0, a1, b0, b1){
      var u = unit(a0, a1), v = unit(b0, b1);
      if (Math.abs(u[0] * v[1] - u[1] * v[0]) > PAR) return false;
      var t0 = sub(b0, a0), t1 = sub(b1, a0);
      return Math.abs(u[0] * t0[1] - u[1] * t0[0]) <= TOL && Math.abs(u[0] * t1[1] - u[1] * t1[0]) <= TOL;
    }
    var polys = legs.map(function(l){ return l.pts.map(M); });
    var cuts = polys.map(function(pl){ return pl.slice(1).map(function(){ return []; }); });
    polys.forEach(function(A, i){ polys.forEach(function(B, j){
      if (j === i) return;
      for (var k = 0; k < A.length - 1; k++) {
        var s0 = A[k], L = Math.hypot(A[k + 1][0] - s0[0], A[k + 1][1] - s0[1]);
        if (L < 1) continue;
        var u = unit(s0, A[k + 1]);
        for (var m = 0; m < B.length - 1; m++) {
          if (!along(s0, A[k + 1], B[m], B[m + 1])) continue;
          var a = dot(u, sub(B[m], s0)), b = dot(u, sub(B[m + 1], s0));
          var lo = Math.max(0, Math.min(a, b)), hi = Math.min(L, Math.max(a, b));
          if (hi - lo < 5) continue;
          [lo, hi].forEach(function(q){ if (q > 1 && q < L - 1) cuts[i][k].push(q); });
        }
      }
    }); });
    polys = polys.map(function(pl, i){
      var out = [pl[0]];
      for (var k = 0; k < pl.length - 1; k++) {
        var d = sub(pl[k + 1], pl[k]), L = Math.hypot(d[0], d[1]);
        cuts[i][k].sort(function(x, y){ return x - y; }).forEach(function(q, n, arr){
          if (n && q - arr[n - 1] < 1) return;
          out.push([pl[k][0] + d[0] * q / L, pl[k][1] + d[1] * q / L]);
        });
        out.push(pl[k + 1]);
      }
      return out;
    });
    function near(a, b){ return Math.hypot(a[0] - b[0], a[1] - b[1]) <= TOL; }
    polys.forEach(function(pl, i){
      var sides = pl.slice(1).map(function(_, k){
        var a = pl[k], b = pl[k + 1], who = [i];
        polys.forEach(function(Q, j){
          if (j === i) return;
          for (var m = 0; m < Q.length - 1; m++)
            if ((near(a, Q[m]) && near(b, Q[m + 1]) && along(a, b, Q[m], Q[m + 1])) || (near(a, Q[m + 1]) && near(b, Q[m]) && along(a, b, Q[m + 1], Q[m]))) { who.push(j); break; }
        });
        if (who.length < 2) return 0;
        who.sort(function(x, y){ return x - y; });
        /* the same side of the street for every sharer: the sign follows the stretch's west→east (or south→north) direction */
        var fwd = a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]) ? 1 : -1;
        return (who.indexOf(i) === 0 ? -1 : 1) * fwd;
      });
      var parts = [], cur = null;
      sides.forEach(function(sd, k){
        if (!cur || cur.off !== sd) { cur = {off:sd, ll:[LL(pl[k])]}; parts.push(cur); }
        cur.ll.push(LL(pl[k + 1]));
      });
      legs[i].parts = parts;
    });
  }

  function legDraw(l){
    var dash = l.ret ? '8 6' : null;
    l.parts.forEach(function(pt, n){
      var off = hasOffset ? pt.off * 4 : 0, thin = !hasOffset && pt.off > 0;
      var cls = 'leg' + (l.ret ? ' ret' : '') + ' l' + l.name.replace(/[^0-9A-Za-z]+/g, '-');
      if (!thin) L.polyline(pt.ll, {color:'#fff', weight:9, opacity:1, lineJoin:'round', lineCap:'round', offset:off, interactive:false, className:'legcase'}).addTo(routeLayer);
      L.polyline(pt.ll, {color:l.col, weight:thin ? 3 : 5, opacity:l.ret ? .7 : 1, dashArray:dash, lineJoin:'round', lineCap:'round', offset:off, interactive:false, className:cls}).addTo(routeLayer);
    });
  }

  /* the leg's midpoint by path length (kept for use by the rows' walk lines) */
  function midpoint(l){
    var cum = [0];
    for (var j = 1; j < l.pts.length; j++) cum.push(cum[j - 1] + metres(l.pts[j - 1], l.pts[j]));
    var d = cum[cum.length - 1] / 2, j = 1;
    while (j < l.pts.length - 1 && cum[j] < d) j++;
    var a = l.pts[j - 1], b = l.pts[j], t = (d - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }

  function fitRoute(){ map.fitBounds(L.latLngBounds(PLACES.map(function(s){ return [s.lat, s.lng]; }).concat(BACK)), {padding:[24, 24]}); }
  map.on('resize', function(){ map.invalidateSize(); });   /* the card changed size: re-measure, but keep whatever zoom the user set */
  map.on('dblclick', fitRoute);   /* double-tap: back to the whole route */

  function buildMap(){
    routeData();
    routeLayer.clearLayers(); markers = [];
    legParts(LEGS);
    LEGS.filter(function(l){ return l.ret; }).concat(LEGS.filter(function(l){ return !l.ret; })).forEach(legDraw);
    PLACES.forEach(function(s, i){
      var steps = liveSteps(s), plain = s.start;
      if (!steps.length && !plain) return;
      var cls = 'pinm' + (s.greek ? ' greek' : '') + (steps.length > 1 ? ' two' : '') + (plain ? ' start' : ''), sz = plain ? 24 : 28;
      var m = L.marker([s.lat, s.lng], {icon:L.divIcon({className:cls, html:'<span>' + (plain ? (s.letter || '') : steps.join('·')) + '</span>', iconSize:[sz, sz], iconAnchor:[sz / 2, sz / 2]}), keyboard:false, riseOnHover:true}).addTo(routeLayer);
      m.bindTooltip(esc(s.n), {permanent:true, direction:'auto', className:'pinlbl', offset:[0, 0], interactive:false});
      m.on('click', function(){ popOpen(i, m); });
      m.place = s; markers.push(m);
    });
    fitRoute();
    paintMap(planStates().cur);
  }

  function paintMap(ni){
    markers.forEach(function(m){
      var el = m.getElement(); if (!el) return;
      var steps = liveSteps(m.place);
      if (!steps.length) return;
      el.classList.toggle('done', steps.every(function(k){ return !!state['p' + (k - 1)]; }));
      el.classList.toggle('now', steps.some(function(k){ return k - 1 === ni && !state['p' + (k - 1)]; }));
    });
  }

  function popClose(){ map.closePopup(); }
  function popOpen(i, m){
    var s = PLACES[i], steps = liveSteps(s);
    var lines = steps.length ? [steps.map(function(k){ return 'step ' + k + ' · ' + esc(PLAN[k - 1].t); }).join(' / ')] : [];
    LEGS.forEach(function(l){
      if (l.a === s || l.b === s) lines.push('<i class="pp-dot" style="background:' + l.col + '"></i>' + l.name + ' · ' + l.min + ' min');
    });
    L.popup({className:'pinpop', closeButton:false, minWidth:168, maxWidth:250, offset:[0, -12], autoPanPadding:[12, 12]})
      .setLatLng(m.getLatLng()).setContent(popPill(steps.length ? PLAN[steps[0] - 1].map : s.map, esc(s.n), lines)).openOn(map);
    linkedRows.forEach(function(r){ r.classList.remove('linked'); });
    linkedRows = s.start ? [parkEl] : steps.map(function(k){ return rowEls[k - 1]; });
    linkedRows.forEach(function(r){ r.classList.add('linked'); });
  }
  map.on('popupclose', function(){ linkedRows.forEach(function(r){ r.classList.remove('linked'); }); linkedRows = []; });

  /* ---------- live location: always on, foreground only; never re-fits the map, never checks a step.
     Denied or unavailable: nothing is said, the chip just never gets its second line. ---------- */
  var watchId = null, fix = null, geoDenied = false;
  if ('track' in state || 'mode' in state) { delete state.track; delete state.mode; save(); }   /* settings from earlier versions */
  function sub(txt){ clockSubEl.textContent = txt; clockSubEl.hidden = !txt; }
  function nearestPin(lat, lng){
    var pin = null, bd = Infinity;
    livePlaces().forEach(function(s){ var d = metres([lat, lng], [s.lat, s.lng]); if (d < bd) { bd = d; pin = s; } });
    return {pin:pin, m:bd};
  }
  function describe(){
    if (!fix) { sub(''); return; }
    var n = nearestPin(fix.lat, fix.lng);
    if (n.m <= 400) sub(' · near ' + n.pin.n);
    else sub(' · ' + (n.m / 1609.344).toFixed(1) + ' mi');
  }
  function drawMe(){
    if (!fix) { meLayer.clearLayers(); meDot = meRing = null; return; }
    var ll = [fix.lat, fix.lng];
    if (!meDot) {
      meRing = L.circle(ll, {radius:fix.acc, color:NOW, weight:0, fillColor:NOW, fillOpacity:.12, interactive:false}).addTo(meLayer);
      meDot = L.circleMarker(ll, {radius:6, color:'#fff', weight:2, fillColor:NOW, fillOpacity:1, interactive:false}).addTo(meLayer);
      return;
    }
    meRing.setLatLng(ll).setRadius(fix.acc); meDot.setLatLng(ll);   /* every fix; the map never pans to it */
  }
  function onFix(pos){
    fix = {lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy || 0};
    describe(); drawMe();
  }
  function onErr(e){ if (e && e.code === 1) { geoDenied = true; stopWatch(); } }   /* a timeout just keeps watching */
  function startWatch(){
    if (watchId !== null || geoDenied || !navigator.geolocation) return;
    try { watchId = navigator.geolocation.watchPosition(onFix, onErr, {enableHighAccuracy:true, maximumAge:5000, timeout:15000}); }
    catch (e) { watchId = null; }
  }
  function stopWatch(){
    if (watchId !== null && navigator.geolocation) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} }
    watchId = null;
  }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stopWatch(); else startWatch(); });

  buildMap();
  startWatch();

  document.getElementById('reset').addEventListener('click', function(){
    state = {}; save();
    var cbs = document.querySelectorAll('.check');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
    popClose(); buildMap(); paint();
  });

  paint();
  setInterval(paint, 30000);
})();
</script>
</body>
