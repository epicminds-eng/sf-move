<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Greek Night</title>
<style>
  :root{
    --bg:#0b0d10; --card:#14181d; --card2:#1b2127; --line:#262d35;
    --ink:#f2f4f6; --ink2:#a9b2bc; --ink3:#6b7682;
    --accent:#f5b84a; --ok:#4fd18b; --now:#5aa9ff;
    --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem;
    --r:1rem; --r2:.6rem;
    --t1:1.6rem; --t2:1.05rem; --t3:.92rem; --t4:.78rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:max(var(--s4),env(safe-area-inset-top)) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom))}
  header{padding:var(--s3) 0 var(--s4)}
  header h1{font-size:var(--t1);letter-spacing:-.02em;font-weight:700}
  header p{color:var(--ink2);font-size:var(--t3);margin-top:var(--s1)}
  .meta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:var(--s1) var(--s3);font-size:var(--t4);color:var(--ink2)}
  .chip b{color:var(--ink);font-weight:600}
  .chip.now{border-color:var(--now);color:var(--now)}
  section{margin-top:var(--s5)}
  section h2{font-size:var(--t4);text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:var(--s3);display:flex;justify-content:space-between;align-items:baseline}
  section h2 span{letter-spacing:0;text-transform:none;color:var(--ink3)}
  .list{display:flex;flex-direction:column;gap:var(--s2)}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s3) var(--s3) var(--s3);position:relative;transition:opacity .2s}
  .item.now,.item.linked{border-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
  .item.done,.item.past{opacity:.42}
  .earlier{font-size:var(--t4);font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-top:var(--s3)}
  .item.done .title{text-decoration:line-through}
  .check{appearance:none;-webkit-appearance:none;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--ink3);margin-top:.1rem;flex:none;display:grid;place-items:center;cursor:pointer}
  .check:checked{background:var(--ok);border-color:var(--ok)}
  .check:checked::after{content:"";width:.5rem;height:.85rem;border:solid #0b0d10;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-10%,-15%)}
  .check.num::after{content:attr(data-n);font-size:var(--t4);font-weight:700;line-height:1;color:var(--ink2);font-variant-numeric:tabular-nums}
  .check.num.key-now::after{color:var(--now)}
  .check.num.key-acc::after{color:var(--accent)}
  .check.num:checked::after{content:attr(data-n);width:auto;height:auto;border:0;transform:none;color:#0b0d10}
  .body{min-width:0}
  .time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:var(--t4);letter-spacing:.04em}
  .item.now .time,.item.linked .time{color:var(--now)}
  .title{font-size:var(--t2);font-weight:600;margin-top:.1rem}
  .note{color:var(--ink2);font-size:var(--t3);margin-top:var(--s1)}
  .map{flex:none;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:var(--r2);background:var(--card2);border:1px solid var(--line);text-decoration:none;font-size:1.1rem;margin-top:.05rem;color:var(--ink2)}
  .map:active{background:var(--line)}
  .side{display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
  .skipbtn{flex:none;padding:var(--s1) var(--s2);font-size:var(--t4);border-radius:999px;line-height:1.2;cursor:pointer}
  .item.skipped{opacity:.42}
  .item.skipped .title{text-decoration:line-through}
  .bring .item{grid-template-columns:auto 1fr}
  .bring .title{font-size:var(--t3);font-weight:500;margin-top:.15rem}
  .actions{display:flex;gap:var(--s2);margin-top:var(--s5)}
  button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r2);padding:var(--s3);font:inherit;font-size:var(--t3)}
  footer{margin-top:var(--s6);text-align:center;color:var(--ink3);font-size:var(--t4)}
  .mapcard{position:relative;width:100%;aspect-ratio:4/3;max-height:60vh;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none}
  /* phone widths: header + map fill the first screen and the plan starts below the fold; 4:3 stays as the minimum */
  @media (max-width:767px){
    .mapcard{aspect-ratio:auto;max-height:none;min-height:calc((100vw - 2 * var(--s4)) * .75);
      height:calc(100vh - var(--hdr, 0px) - env(safe-area-inset-top) - var(--s4));
      height:calc(100dvh - var(--hdr, 0px) - env(safe-area-inset-top) - var(--s4))}
  }
  .mapcard svg{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .mapchip{position:absolute;bottom:var(--s3);left:var(--s3);z-index:3;pointer-events:none}
  .gn-land{fill:#ece6d8}
  .gn-campus{fill:#dfe6d3}
  .gn-st-case{stroke:rgba(0,0,0,.10);stroke-width:3;stroke-linecap:round}
  .gn-st{stroke:#fff;stroke-width:1.5;stroke-linecap:round}
  .gn-st-case,.gn-st,.gn-route-case,.gn-route{vector-effect:non-scaling-stroke}
  .gn-st-l{font-size:9px;fill:#8b8578;stroke:#ece6d8;stroke-width:3;paint-order:stroke;stroke-linejoin:round;font-weight:500}
  .gn-route-case{fill:none;stroke:#fff;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
  .gn-route{fill:none;stroke:var(--now);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
  .gn-route.ret{stroke-dasharray:8 6;opacity:.7}
  .pp-dot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.35rem;vertical-align:.05em}
  .pin-l{font-size:9px;fill:#6f6a5f;stroke:#ece6d8;stroke-width:3;paint-order:stroke;stroke-linejoin:round;font-weight:600}
  .walk-b{fill:#fff;stroke-width:1.5}
  .walk-t{font-size:9px;font-weight:700}
  .walk.ret{opacity:.7}
  .walk.ret .walk-b{stroke-dasharray:3 2}
  .pin{cursor:pointer;transition:opacity .2s}
  .pin.done{opacity:.45}
  .pin-c{fill:var(--now);stroke:#fff;stroke-width:2}
  .pin.greek .pin-c{fill:var(--accent)}
  .pin-n{fill:#fff;font-size:10px;font-weight:700;pointer-events:none}
  .pin.greek .pin-n{fill:#0b0d10}
  .pin-n.two{font-size:7px;letter-spacing:-.03em}
  .pin-hit{fill:transparent}
  .pulse{display:none;fill:none;stroke:var(--now);stroke-width:2;transform-box:fill-box;transform-origin:center}
  .pin.now .pulse{display:block;animation:gnPulse 2s ease-out infinite}
  @keyframes gnPulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){.pin.now .pulse{animation:none;transform:scale(1.6);opacity:.6}}
  .pinpop{position:absolute;z-index:4;width:max-content;min-width:168px;max-width:250px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);box-shadow:0 8px 26px rgba(0,0,0,.45);font-size:var(--t4);line-height:1.35;transform:translate(-50%,-100%)}
  .pinpop.below{transform:translate(-50%,0)}
  .pinpop .pp{display:flex;align-items:center;gap:var(--s2);color:inherit;text-decoration:none}
  .pinpop .pp-t{flex:1;min-width:0}
  .pinpop b{display:block;font-size:var(--t3);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinpop .pp-m{display:block;margin-top:2px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .pinpop .pp-c{flex:none;font-size:1.4rem;line-height:1;color:var(--ink3)}
  .me-ring{fill:var(--now);opacity:.12}
  .me-dot{fill:var(--now);stroke:#fff;stroke-width:2}
  .me-arrow{fill:var(--now);stroke:#fff;stroke-width:1.5;stroke-linejoin:round}
  .me-l{font-size:9px;font-weight:700;fill:var(--now);stroke:#ece6d8;stroke-width:3;paint-order:stroke;stroke-linejoin:round}
  #clock{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.3}
  #clock .sub{color:var(--ink2);font-size:var(--t4)}
  #clock .sub[hidden]{display:none}
</style>
</head>
<body>
<header>
  <h1>Greek Night</h1>
  <p>Jack Johnson + G. Love · Thu Oct 1 2026 · Berkeley</p>
  <div class="meta">
    <span class="chip">Doors <b>5:00</b></span>
    <span class="chip">Show <b>6:30</b></span>
    <span class="chip">Julia's <b>5:00</b> ×2</span>
    <span class="chip now" id="clock"><span id="clocktime">—</span><span class="sub" id="clocksub" hidden></span></span>
  </div>
</header>

<div class="mapcard" id="mapcard">
  <span class="chip mapchip">BART from Civic Center · 35 min</span>
  <svg id="gnmap" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Route map"></svg>
  <div class="pinpop" id="pinpop" hidden></div>
</div>

<section>
  <h2>Plan <span id="progress"></span></h2>
  <div class="list" id="plan"></div>
</section>

<section class="bring">
  <h2>Bring</h2>
  <div class="list" id="bring"></div>
</section>

<div class="actions">
  <button id="reset">Reset checks</button>
</div>

<footer>Greek Night · v1</footer>

<script>
(function(){
  'use strict';
  var M = function(q){ return 'https://maps.apple.com/?q=' + encodeURIComponent(q); };

  var PLAN = [
    {t:'2:30', h:14, m:30, title:'Leave Grove St', note:'Uber to Civic Center BART (bus is fine, Uber buys you the Campanile).', map:M('Civic Center BART Station San Francisco')},
    {t:'2:50', h:14, m:50, title:'Red line → Richmond', note:'Sit on the right side for the bay coming out of the tube. ~35 min.', map:M('Civic Center BART Station San Francisco')},
    {t:'3:25', h:15, m:25, title:'Downtown Berkeley BART', note:'Exit to Shattuck, east on Center St two blocks to campus.', map:M('Downtown Berkeley BART Station')},
    {t:'3:30', h:15, m:30, title:'Doe Library', note:'Through the west gate, straight ahead. No ID needed. North Reading Room (the vaulted one, green lamps) and Morrison Library (wood-panelled, couches, records) — both just inside the entrance. Whisper.', map:M('Doe Memorial Library UC Berkeley')},
    {t:'3:55', h:15, m:55, title:'Campanile', note:'Elevator’s likely closed by now — the lawn at the base is the view. 10 min.', map:M('Sather Tower UC Berkeley')},
    {t:'4:10', h:16, m:10, title:'Caffe Strada', note:'Exit campus at the SE corner (Bancroft & College). The patio under the trees. Tea or espresso.', map:M('Caffe Strada 2300 College Ave Berkeley')},
    {t:'4:30', h:16, m:30, title:'Telegraph Ave', note:'West on Bancroft, south on Telegraph. Amoeba and Moe’s. 15 min.', map:M('Amoeba Music 2455 Telegraph Ave Berkeley')},
    {t:'4:50', h:16, m:50, title:'Berkeley City Club', note:'North to Durant, two blocks west. Julia Morgan, 1929 — courtyard and indoor pool through the back. Julia’s is 2nd floor.', map:M('Berkeley City Club 2315 Durant Ave Berkeley')},
    {t:'5:00', h:17, m:0, title:'Dinner — Julia’s', note:'Table for 2. Zero-proof cocktails. Niçoise w/ trout, ratatouille, beet salad. Ask for the check by 6:10.', map:M('Julia’s Restaurant 2315 Durant Ave Berkeley')},
    {t:'6:15', h:18, m:15, title:'Walk to the Greek', note:'Durant east → College Ave north → Gayley Rd. 15 min, uphill at the end.', map:M('Greek Theatre 2001 Gayley Rd Berkeley')},
    {t:'6:35', h:18, m:35, title:'In the gate', note:'G. Love on. Jack ~8:00. Done ~10:15. GA pit — standing, front of stage. Water refill on the middle concourse.', map:M('Greek Theatre 2001 Gayley Rd Berkeley')},
    {t:'10:15', h:22, m:15, title:'Uber from North Gate', note:'Out the north side: up Gayley to Hearst, west on Hearst to Euclid. 8 min downhill, clear of the Gayley crowd. If surge is bad keep going west to Shattuck (10 more min).', map:M('Hearst Ave & Euclid Ave Berkeley')}
  ];

  var BRING = [
    'Hoodie / jacket — mid-50s after dark',
    'Comfortable shoes — pit is standing, 6:30 to 10:15',
    'Small blanket (under 40×60) — only if you want the lawn for the back half',
    'Empty water bottle',
    'Small bag only — no bag check, everything searched',
    'Sunscreen for 5–7pm, bowl faces west',
    'Phone charged · Clipper in Wallet · tickets in Wallet'
  ];

  var KEY = 'greek-night-v2';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var planEl = document.getElementById('plan');
  var bringEl = document.getElementById('bring');
  var progEl = document.getElementById('progress');
  var clockTimeEl = document.getElementById('clocktime');
  var clockSubEl = document.getElementById('clocksub');

  function row(id, time, title, note, map){
    var el = document.createElement('label');
    el.className = 'item';
    el.dataset.id = id;
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'check'; cb.checked = !!state[id];
    if (id.charAt(0) === 'p') { cb.classList.add('num'); cb.setAttribute('data-n', +id.slice(1) + 1); }
    cb.addEventListener('change', function(){ state[id] = cb.checked; save(); paint(); });
    var body = document.createElement('div'); body.className = 'body';
    if (time) { var tt = document.createElement('div'); tt.className = 'time'; tt.textContent = time; body.appendChild(tt); }
    var ti = document.createElement('div'); ti.className = 'title'; ti.textContent = title; body.appendChild(ti);
    if (note) { var nn = document.createElement('div'); nn.className = 'note'; nn.textContent = note; body.appendChild(nn); }
    el.appendChild(cb); el.appendChild(body);
    if (map) {
      var a = document.createElement('a'); a.className = 'map'; a.href = map; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↗'; a.setAttribute('aria-label', 'Apple Maps');
      a.addEventListener('click', function(ev){ ev.stopPropagation(); });
      el.appendChild(a);
    }
    return el;
  }

  var rowEls = PLAN.map(function(p, i){ return planEl.appendChild(row('p' + i, p.t, p.title, p.note, p.map)); });   /* by step; the list itself reorders */
  BRING.forEach(function(b, i){ bringEl.appendChild(row('b' + i, '', b, '', '')); });

  /* steps 4–8 can be skipped: a chip under the ↗ button; the row's right column stacks the two */
  function isSkipped(step){ return !!(state.skip && state.skip['p' + (step - 1)]); }
  function skipGain(i){ return (PLAN[i + 1].h * 60 + PLAN[i + 1].m) - (PLAN[i].h * 60 + PLAN[i].m); }
  [4, 5, 6, 7, 8].forEach(function(step){
    var r = rowEls[step - 1], a = r.querySelector('.map');
    var side = document.createElement('div'); side.className = 'side';
    r.replaceChild(side, a); side.appendChild(a);
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip skipbtn'; b.textContent = 'Skip';
    b.addEventListener('click', function(ev){
      ev.preventDefault(); ev.stopPropagation();
      var id = 'p' + (step - 1);
      state.skip = state.skip || {};
      if (state.skip[id]) delete state.skip[id]; else state.skip[id] = true;
      save(); popClose(); buildMap(); paint();
    });
    side.appendChild(b);
  });

  /* Each step's place in the evening (on Oct 1; any other day nothing is under way):
     done = ticked or skipped; past = its next step started more than 15 min ago (the last step: an hour after its own time);
     current = the first step that has started and is neither; everything else is still to come. */
  function minsNow(){
    var d = new Date();
    return d.getMonth() === 9 && d.getDate() === 1 ? d.getHours() * 60 + d.getMinutes() : -1;
  }
  function planStates(){
    var now = minsNow(), cur = -1;
    var st = PLAN.map(function(p, i){
      if (state['p' + i] || isSkipped(i + 1)) return 'done';
      if (now < 0) return 'up';
      var start = p.h * 60 + p.m, nx = PLAN[i + 1], end = nx ? nx.h * 60 + nx.m + 15 : start + 60;
      if (now > end) return 'past';
      if (now >= start && cur < 0) { cur = i; return 'cur'; }
      return 'up';
    });
    return {st:st, cur:cur};
  }
  /* current first, then what's still to come in time order; under "Earlier", what's behind you in plan order.
     A row that moves slides to its new place (FLIP, 250 ms) rather than jumping; the first paint just sets the order. */
  var earlierEl = document.createElement('div'), firstOrder = true;
  earlierEl.className = 'earlier'; earlierEl.textContent = 'Earlier';
  function reorder(ps){
    var top = [], back = [];
    if (ps.cur >= 0) top.push(rowEls[ps.cur]);
    rowEls.forEach(function(r, i){ if (ps.st[i] === 'up') top.push(r); });
    rowEls.forEach(function(r, i){ if (ps.st[i] === 'past' || ps.st[i] === 'done') back.push(r); });
    var seq = back.length ? top.concat([earlierEl], back) : top;
    var have = Array.prototype.slice.call(planEl.children);
    if (have.length === seq.length && have.every(function(e, i){ return e === seq[i]; })) return;
    var was = have.map(function(e){ return e.getBoundingClientRect().top; });
    seq.forEach(function(e){ planEl.appendChild(e); });
    if (!back.length && earlierEl.parentNode) planEl.removeChild(earlierEl);
    var animate = !firstOrder && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    firstOrder = false;
    if (!animate) return;
    var moved = [];
    have.forEach(function(e, k){
      if (!e.parentNode) return;
      var d = was[k] - e.getBoundingClientRect().top;
      if (Math.abs(d) < 1) return;
      e.style.transition = 'none'; e.style.transform = 'translateY(' + d + 'px)'; moved.push(e);
    });
    if (!moved.length) return;
    void planEl.offsetHeight;   /* commit the old positions before playing to the new ones */
    moved.forEach(function(e){ e.style.transition = 'transform .25s ease'; e.style.transform = ''; });
    setTimeout(function(){ moved.forEach(function(e){ e.style.transition = ''; }); }, 300);
  }

  function paint(){
    var done = 0, skipped = 0, ps = planStates();
    rowEls.forEach(function(r, i){
      var checked = !!state['p' + i], sk = isSkipped(i + 1);
      r.classList.toggle('done', checked);
      r.classList.toggle('skipped', sk);
      r.classList.toggle('past', ps.st[i] === 'past');
      r.classList.toggle('now', i === ps.cur);
      var note = r.querySelector('.note'), btn = r.querySelector('.skipbtn');
      if (note) note.textContent = sk ? 'Skipped · +' + skipGain(i) + ' min' : PLAN[i].note;
      if (btn) btn.textContent = sk ? 'Restore' : 'Skip';
      if (sk) skipped++; else if (checked) done++;
    });
    reorder(ps);
    var brows = bringEl.children;
    for (var j = 0; j < brows.length; j++) brows[j].classList.toggle('done', !!state['b' + j]);
    progEl.textContent = done + ' / ' + (PLAN.length - skipped);
    var d = new Date();
    var hh = d.getHours() % 12 || 12, mm = ('0' + d.getMinutes()).slice(-2);
    clockTimeEl.textContent = 'Now ' + hh + ':' + mm + (d.getHours() < 12 ? ' am' : ' pm');
    paintMap(ps.cur);
  }

  /* ---------- map hero: offline SVG, projected from the data ---------- */
  var PLACES = [
    {n:'Downtown Berkeley BART', lat:37.8699, lng:-122.2681, steps:[3]},
    {n:'Doe Library', lat:37.8723, lng:-122.2592, steps:[4]},
    {n:'Campanile', lat:37.8721, lng:-122.2578, steps:[5]},
    {n:'Caffe Strada', lat:37.8688, lng:-122.2533, steps:[6]},
    {n:'Amoeba / Moe’s', lat:37.8657, lng:-122.2587, steps:[7]},
    {n:'Berkeley City Club', lat:37.8678, lng:-122.2612, steps:[8, 9]},
    {n:'Greek Theatre', lat:37.8737, lng:-122.2543, steps:[11], greek:true},
    {n:'North Gate', lat:37.8749, lng:-122.2604, steps:[12], home:true}   /* the Uber home: end of the return, not on the walk out */
  ];
  /* walk out, as legs between pins: the waypoints between the two; the Bancroft & College retrace is the same sidewalk */
  var LEG_WP = {
    '3-4': [[37.8702, -122.2662], [37.8718, -122.2640]],
    '4-5': [],
    '5-6': [[37.8700, -122.2555], [37.8687, -122.2535]],
    '6-7': [[37.8687, -122.2588]],
    '7-8': [[37.8677, -122.2588]],
    '8-11': [[37.8677, -122.2535], [37.8687, -122.2535], [37.8705, -122.2545]]
  };
  /* a skipped pin's two legs splice into one: the waypoints from the previous live pin to the next; adjacent skips chain in order */
  var BYPASS = {
    4: [[37.8702, -122.2662], [37.8718, -122.2640], [37.8723, -122.2592]],
    5: [[37.8700, -122.2555], [37.8687, -122.2535]],
    6: [[37.8703, -122.2595], [37.8687, -122.2588]],
    7: [[37.8687, -122.2588], [37.8687, -122.2612]],
    8: [[37.8677, -122.2588], [37.8677, -122.2535], [37.8687, -122.2535], [37.8705, -122.2545]]
  };
  /* a gap with a better walk than its chained bypasses: skip 5 and 6 → Doe, Sather Gate, Bancroft & Telegraph, Amoeba */
  var GAP_OVERRIDE = {'4-7': BYPASS[6]};

        var d = cum[cum.length - 1] * fr, j = 1;
        while (j < pts.length - 1 && cum[j] < d) j++;
        var a = pts[j - 1], b = pts[j], t = (d - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
        return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      }
      function crowding(c){   /* the pin, earlier pill or card edge this spot is too close to, if any */
        var r = {x:c[0] - pw / 2, y:c[1] - ph / 2, w:pw, h:ph};
        if (r.x < 3 || r.y < 3 || r.x + r.w > w - 3 || r.y + r.h > h - 3)
          return [r.x < 3 ? -1e3 : r.x + r.w > w - 3 ? w + 1e3 : c[0], r.y < 3 ? -1e3 : r.y + r.h > h - 3 ? h + 1e3 : c[1]];
        for (var i = 0; i < pinPts.length; i++) {
          var q = pinPts[i];
          if (Math.hypot(q[0] - c[0], q[1] - c[1]) < 14) return q;
          var nx = Math.max(r.x, Math.min(q[0], r.x + r.w)), ny = Math.max(r.y, Math.min(q[1], r.y + r.h));
          if ((nx - q[0]) * (nx - q[0]) + (ny - q[1]) * (ny - q[1]) < 12 * 12) return q;
        }
        for (var j = 0; j < pillBoxes.length; j++) if (rectsHit(r, pillBoxes[j])) return [pillBoxes[j].x + pillBoxes[j].w / 2, pillBoxes[j].y + pillBoxes[j].h / 2];
        return null;
      }
      var fr0 = 0.5;
      var c = at(fr0), q = crowding(c);
      if (q) {
        var step = 1.5 / cum[cum.length - 1], a0 = at(Math.max(0, fr0 - step)), b0 = at(Math.min(1, fr0 + step));
        var dirs = Math.hypot(b0[0] - q[0], b0[1] - q[1]) > Math.hypot(a0[0] - q[0], a0[1] - q[1]) ? [1, -1] : [-1, 1], found = null;
        dirs.some(function(dir){
          for (var fr = fr0 + dir * step; fr > 0.04 && fr < 0.96; fr += dir * step) { var cc = at(fr); if (!crowding(cc)) { found = cc; return true; } }
          return false;
        });
        if (found) c = found;
      }
      var g = kGroup('walk' + (l.ret ? ' ret' : ''), toUser(c), gp, {'data-leg':l.name});
      S('rect', {'class':'walk-b', x:f(-pw / 2), y:f(-ph / 2), width:f(pw), height:ph, rx:ph / 2, style:'stroke:' + l.col}, g);
      S('text', {'class':'walk-t', x:0, y:3.2, 'text-anchor':'middle', style:'fill:' + darker(l.col)}, g).textContent = txt;
      pillBoxes.push({x:c[0] - pw / 2 - 1, y:c[1] - ph / 2 - 1, w:pw + 2, h:ph + 2});
      ob.rects.push({x:c[0] - pw / 2 - 2, y:c[1] - ph / 2 - 2, w:pw + 4, h:ph + 4});
    });

    /* pin names: right of the pin (left in the right third), then the other side, then above / below.
       The most boxed-in pin picks first, so a roomy neighbour doesn't take the only spot near it. */
    function nameCands(s){
      var p = Ps(s.lat, s.lng), len = measure('pin-l', s.n), H = 10;
      var R = {r:{x:p[0] + 13, y:p[1] - 5, w:len, h:H}, anchor:'start', x:p[0] + 13};
      var L = {r:{x:p[0] - 13 - len, y:p[1] - 5, w:len, h:H}, anchor:'end', x:p[0] - 13};
      var cands = p[0] > w * 2 / 3 ? [L, R] : [R, L];
      [p[1] - 15, p[1] + 5].forEach(function(y){
        cands.push({r:{x:p[0] + 11, y:y, w:len, h:H}, anchor:'start', x:p[0] + 11});
        cands.push({r:{x:p[0] - 11 - len, y:y, w:len, h:H}, anchor:'end', x:p[0] - 11});
      });
      [p[1] - 13 - H, p[1] + 13, p[1] - 22 - H, p[1] + 22].forEach(function(y){
        cands.push({r:{x:p[0] - len / 2, y:y, w:len, h:H}, anchor:'middle', x:p[0]});
        cands.push({r:{x:p[0] + 8, y:y, w:len, h:H}, anchor:'start', x:p[0] + 8});
        cands.push({r:{x:p[0] - 8 - len, y:y, w:len, h:H}, anchor:'end', x:p[0] - 8});
      });
      return cands;
    }
    livePlaces().filter(function(s){ return onScreen(Ps(s.lat, s.lng), 0); })   /* off the zoomed window: nothing to label */
      .map(function(s, i){ return {s:s, i:i, free:nameCands(s).filter(function(c){ return scoreBox(c.r, ob, w, h) === 0; }).length}; })
      .sort(function(x, y){ return x.free - y.free || x.i - y.i; })
      .forEach(function(e){
        var s = e.s, p = Ps(s.lat, s.lng), len = measure('pin-l', s.n), H = 10, cands = nameCands(s);
        var bb = best(cands), b = bb.c;
        if (bb.s > 0) {
          /* crowded corner: take the nearest clear spot close to the pin instead */
          var near = null, nd = Infinity;
          for (var dy = -44; dy <= 44; dy++) for (var dx = -len - 44; dx <= 44; dx++) {
            var r = {x:p[0] + dx, y:p[1] + dy, w:len, h:H};
            var qx = Math.max(r.x, Math.min(p[0], r.x + r.w)) - p[0], qy = Math.max(r.y, Math.min(p[1], r.y + r.h)) - p[1];
            var d = Math.sqrt(qx * qx + qy * qy);
            if (d < nd && scoreBox(r, ob, w, h) === 0) { nd = d; near = r; }
          }
          if (near) b = {r:near, anchor:'start', x:near.x};
        }
        var g = kGroup('pin-lg', FIT.P(s.lat, s.lng), gl);
        S('text', {'class':'pin-l', x:f(b.x - p[0]), y:f(b.r.y + 8 - p[1]), 'text-anchor':b.anchor}, g).textContent = s.n;
        ob.rects.push(b.r);
      });

    /* street names: beside the line on its visible part; a street with no clear spot goes unlabelled rather than under the route.
       East–west names go first: a north–south name can slide along its whole street, Hearst only has a strip by the top edge. */
    STREETS.map(function(st, i){ return i; }).sort(function(i, j){ return STREETS[i][1] - STREETS[j][1] || i - j; }).forEach(function(i){
      var st = STREETS[i];
      if (!st[5]) return;
      var a = toScreen(FIT.streets[i][0]), b = toScreen(FIT.streets[i][1]), len = measure('gn-st-l', st[0]), cands = [];
      /* the preferred spots first, then every 5% along, for a street whose free stretch is short; then the same again
         5 units farther out, for a street carrying a pair of parallel legs */
      [0, 5].forEach(function(o){
        [0.7, 0.5, 0.85, 0.3, 0.15, 0.6, 0.4, 0.95, 0.05, 0.75, 0.65, 0.55, 0.45, 0.35, 0.25, 0.2, 0.1, 0.8, 0.9].forEach(function(fr){
          if (st[1]) {
            var y0 = Math.min(h - 6, Math.max(a[1], b[1])), y1 = Math.max(6, Math.min(a[1], b[1]));
            var ly = y0 - (y0 - y1) * fr, x = a[0];
            /* a rotated label renders about a unit wider than its nominal 10: allow for it */
            cands.push({r:{x:x + 5 + o, y:ly - len / 2, w:12, h:len}, x:x, y:ly, dy:String(15 + o), rot:true});
            cands.push({r:{x:x - 17 - o, y:ly - len / 2, w:12, h:len}, x:x, y:ly, dy:String(-7 - o), rot:true});
          } else {
            var x0 = Math.max(6, Math.min(a[0], b[0])), x1 = Math.min(w - 6, Math.max(a[0], b[0]));
            var lx = x0 + (x1 - x0) * fr - len / 2, yy = a[1];
            cands.push({r:{x:lx, y:yy - 16 - o, w:len, h:10}, x:lx, y:yy, dy:String(-8 - o)});
            cands.push({r:{x:lx, y:yy + 6 + o, w:len, h:10}, x:lx, y:yy, dy:String(15 + o)});
          }
        });
      });
      var r = best(cands);
      if (r.s > 0) return;
      var c = r.c, g = kGroup('st-lg', toUser([c.x, c.y]), gl), at = {'class':'gn-st-l', x:0, y:0, dy:c.dy};
      if (c.rot) { at['text-anchor'] = 'middle'; at.transform = 'rotate(-90)'; }
      S('text', at, g).textContent = st[0];
      ob.rects.push(c.r);
    });

    pinEls = PLACES.map(function(s, i){
      var steps = liveSteps(s);
      if (!steps.length) return null;
      var g = kGroup('pin' + (s.greek ? ' greek' : ''), FIT.P(s.lat, s.lng), gTop, {'data-i':i});
      S('circle', {'class':'pin-hit', r:20}, g);
      S('circle', {'class':'pulse', r:9}, g);
      S('circle', {'class':'pin-c', r:9}, g);
      var n = S('text', {'class':'pin-n' + (steps.length > 1 ? ' two' : ''), 'text-anchor':'middle', dy:steps.length > 1 ? '2.5' : '3.5'}, g);
      n.textContent = steps.join('·');
      return g;
    });
    paintMap(planStates().cur);
    drawMe();
  }

  function paintMap(ni){
    pinEls.forEach(function(g, i){
      if (!g) return;
      var steps = liveSteps(PLACES[i]);
      g.classList.toggle('done', steps.every(function(k){ return !!state['p' + (k - 1)]; }));
      g.classList.toggle('now', steps.some(function(k){ return k - 1 === ni && !state['p' + (k - 1)]; }));
    });
  }

  function popClose(){
    popEl.hidden = true; popEl.innerHTML = '';
    linkedRows.forEach(function(r){ r.classList.remove('linked'); }); linkedRows = [];
  }
  function popOpen(i){
    var s = PLACES[i], steps = liveSteps(s);
    var lines = [steps.map(function(k){ return 'step ' + k + ' · ' + esc(PLAN[k - 1].t); }).join(' / ')];
    LEGS.forEach(function(l){
      if (l.a === s || l.b === s) lines.push('<i class="pp-dot" style="background:' + l.col + '"></i>' + l.name + ' · ' + l.min + ' min');
    });
    popEl.innerHTML = popPill(PLAN[steps[0] - 1].map, esc(s.n), lines);
    popEl.hidden = false;
    linkedRows.forEach(function(r){ r.classList.remove('linked'); });
    linkedRows = steps.map(function(k){ return rowEls[k - 1]; });
    linkedRows.forEach(function(r){ r.classList.add('linked'); });
    var c = pinEls[i].querySelector('.pin-c').getBoundingClientRect(), r = cardEl.getBoundingClientRect();
    var cx = c.left + c.width / 2 - r.left, top = c.top - r.top, bot = c.bottom - r.top;
    var pw = popEl.offsetWidth, ph = popEl.offsetHeight;
    var below = top - 8 - ph < 4;
    popEl.classList.toggle('below', below);
    popEl.style.left = Math.max(pw / 2 + 8, Math.min(r.width - pw / 2 - 8, cx)) + 'px';
    popEl.style.top = (below ? bot + 8 : top - 8) + 'px';
  }

  /* ---------- live location: always on, foreground only; never re-fits the map, never checks a step.
     Denied or unavailable: nothing is said, the chip just never gets its second line. ---------- */
  var watchId = null, fix = null, geoDenied = false;
  if ('track' in state) { delete state.track; save(); }   /* the old on/off toggle's setting */
  function sub(txt){ clockSubEl.textContent = txt; clockSubEl.hidden = !txt; }
  function nearestPin(lat, lng){
    var pin = null, bd = Infinity;
    livePlaces().forEach(function(s){ var d = metres([lat, lng], [s.lat, s.lng]); if (d < bd) { bd = d; pin = s; } });
    return {pin:pin, m:bd};
  }
  function describe(){
    if (!fix) { sub(''); return; }
    var n = nearestPin(fix.lat, fix.lng);
    if (n.m <= 400) sub('near ' + n.pin.n + ' · ' + Math.round(n.m * 3.28084) + ' ft');
    else sub((n.m / 1609.344).toFixed(1) + ' mi from Berkeley');
  }
  function drawMe(){
    var old = svg.querySelector('.me'); if (old) svg.removeChild(old);
    if (!fix || !FIT) return;
    var w = FIT.w, h = FIT.h, m = 16, u = FIT.P(fix.lat, fix.lng), p = toScreen(u);
    if (p[0] >= m && p[0] <= w - m && p[1] >= m && p[1] <= h - m) {
      var g = S('g', {'class':'me', transform:kT(u)}, svg);
      var rpx = Math.min(60, (fix.acc || 0) * FIT.sc / 111320);   /* accuracy metres → px at the fitted scale */
      if (rpx > 6) S('circle', {'class':'me-ring', r:f(rpx)}, g);
      S('circle', {'class':'me-dot', r:6}, g);
      return;
    }
    /* off the window (still in SF, on BART, or zoomed away): an arrow on the edge pointing at the true position, with the distance to it */
    var cx = w / 2, cy = h / 2, dx = p[0] - cx, dy = p[1] - cy, t = Infinity;
    if (dx > 0) t = Math.min(t, (w - m - cx) / dx); else if (dx < 0) t = Math.min(t, (m - cx) / dx);
    if (dy > 0) t = Math.min(t, (FIT.bottom - cy) / dy); else if (dy < 0) t = Math.min(t, (m - cy) / dy);
    var ex = cx + dx * t, ey = cy + dy * t, ang = Math.atan2(dy, dx) * 180 / Math.PI, eu = toUser([ex, ey]);
    var eLat = (FIT.oy - eu[1]) / FIT.sc, eLng = (eu[0] - FIT.ox) / (FIT.sc * K);
    var mi = metres([eLat, eLng], [fix.lat, fix.lng]) / 1609.344;
    var ge = S('g', {'class':'me', transform:kT(eu)}, svg);
    S('path', {'class':'me-arrow', d:'M8 0L-6 6L-3 0L-6 -6Z', transform:'rotate(' + f(ang) + ')'}, ge);
    var len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len, off = 12 + Math.abs(ux) * 16 + Math.abs(uy) * 6;
    S('text', {'class':'me-l', x:f(-ux * off), y:f(-uy * off), dy:'3.5', 'text-anchor':'middle'}, ge).textContent = mi.toFixed(1) + ' mi';
  }
  function onFix(pos){
    fix = {lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy || 0};
    describe(); drawMe();
  }
  function onErr(e){ if (e && e.code === 1) { geoDenied = true; stopWatch(); } }   /* a timeout just keeps watching */
  function startWatch(){
    if (watchId !== null || geoDenied || !navigator.geolocation) return;
    try { watchId = navigator.geolocation.watchPosition(onFix, onErr, {enableHighAccuracy:true, maximumAge:5000, timeout:15000}); }
    catch (e) { watchId = null; }
  }
  function stopWatch(){
    if (watchId !== null && navigator.geolocation) { try { navigator.geolocation.clearWatch(watchId); } catch (e) {} }
    watchId = null;
  }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stopWatch(); else startWatch(); });

  /* ---------- pinch zoom and pan, no controls: two fingers zoom about their midpoint, one finger pans,
     a still finger is a tap, a double tap goes back to the fitted view, the wheel zooms on desktop ---------- */
  var ptrs = {}, gest = null, lastTap = null, wheelT = null, anim = null;
  function local(e){ var r = svg.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function down(){ return Object.keys(ptrs); }
  function startPan(sp){ gest = {mode:'pan', s:sp, v0:{x:VIEW.x, y:VIEW.y}}; }
  function startPinch(){
    var k = down(), a = ptrs[k[0]], b = ptrs[k[1]];
    gest = {mode:'pinch', d0:Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, z0:VIEW.z, U0:toUser([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2])};
  }
  function stopAnim(){ if (anim) { cancelAnimationFrame(anim); anim = null; } }
  svg.addEventListener('pointerdown', function(e){
    stopAnim();
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    ptrs[e.pointerId] = local(e);
    var n = down().length;
    if (n === 1) gest = {mode:'tap', s:ptrs[e.pointerId], target:e.target};
    else if (n === 2) { popClose(); startPinch(); }
    e.preventDefault();
  });
  svg.addEventListener('pointermove', function(e){
    if (!(e.pointerId in ptrs) || !gest) return;
    var sp = ptrs[e.pointerId] = local(e);
    if (gest.mode === 'tap') {
      if (Math.hypot(sp[0] - gest.s[0], sp[1] - gest.s[1]) <= 6) return;
      popClose(); startPan(gest.s);
    }
    if (gest.mode === 'pan') {
      VIEW.x = gest.v0.x - (sp[0] - gest.s[0]) / VIEW.z; VIEW.y = gest.v0.y - (sp[1] - gest.s[1]) / VIEW.z;
    } else if (gest.mode === 'pinch' && down().length === 2) {
      var k = down(), a = ptrs[k[0]], b = ptrs[k[1]], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      VIEW.z = Math.max(1, Math.min(4, gest.z0 * Math.hypot(a[0] - b[0], a[1] - b[1]) / gest.d0));
      VIEW.x = gest.U0[0] - m[0] / VIEW.z; VIEW.y = gest.U0[1] - m[1] / VIEW.z;   /* the point under the fingers stays under them */
    }
    clampView(); applyView();
  });
  function lift(e){
    if (!(e.pointerId in ptrs)) return;
    delete ptrs[e.pointerId];
    if (!gest) return;
    var left = down();
    if (left.length === 1 && gest.mode === 'pinch') { startPan(ptrs[left[0]]); return; }   /* one finger lifts: the other pans on */
    if (left.length) return;
    var g = gest; gest = null;
    if (g.mode === 'tap') { if (e.type === 'pointerup') tap(g); }
    else layout();   /* zoom / pan end: place the labels for the new window */
  }
  svg.addEventListener('pointerup', lift);
  svg.addEventListener('pointercancel', lift);
  function tap(g){
    var now = Date.now();
    if (lastTap && now - lastTap.t < 300 && Math.hypot(g.s[0] - lastTap.s[0], g.s[1] - lastTap.s[1]) < 10) {
      lastTap = null; popClose(); fitView(); return;
    }
    lastTap = {t:now, s:g.s};
    var pin = g.target && g.target.closest ? g.target.closest('.pin') : null;
    if (pin) popOpen(+pin.getAttribute('data-i')); else popClose();
  }
  function fitView(){
    if (VIEW.z === 1 && !VIEW.x && !VIEW.y) return;
    var from = {x:VIEW.x, y:VIEW.y, z:VIEW.z}, t0 = null;
    function step(t){
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / 200), e = 1 - Math.pow(1 - k, 3);
      VIEW = {x:from.x * (1 - e), y:from.y * (1 - e), z:from.z + (1 - from.z) * e};
      applyView();
      if (k < 1) anim = requestAnimationFrame(step); else { anim = null; VIEW = {x:0, y:0, z:1}; layout(); }
    }
    stopAnim(); anim = requestAnimationFrame(step);
  }
  svg.addEventListener('wheel', function(e){
    e.preventDefault(); stopAnim(); popClose();
    var m = local(e), U = toUser(m);
    VIEW.z = Math.max(1, Math.min(4, VIEW.z * Math.exp(-e.deltaY * 0.0015)));
    VIEW.x = U[0] - m[0] / VIEW.z; VIEW.y = U[1] - m[1] / VIEW.z;
    clampView(); applyView();
    clearTimeout(wheelT); wheelT = setTimeout(layout, 150);
  }, {passive:false});

  /* the map card is sized from the header's height at phone widths; any change of the card's size refits the map
     and re-places the chip-aware labels */
  var headerEl = document.querySelector('header'), rsT = null, lastW = '';
  function sizeCard(){ document.documentElement.style.setProperty('--hdr', headerEl.offsetHeight + 'px'); }
  function resized(){
    clearTimeout(rsT);
    rsT = setTimeout(function(){
      if (svg.clientWidth + 'x' + svg.clientHeight === lastW) return;
      lastW = svg.clientWidth + 'x' + svg.clientHeight; popClose(); buildMap(); paint();
    }, 150);
  }
  window.addEventListener('resize', function(){ sizeCard(); resized(); });
  if (window.ResizeObserver) { new ResizeObserver(sizeCard).observe(headerEl); new ResizeObserver(resized).observe(svg); }
  sizeCard();
  buildMap(); lastW = svg.clientWidth + 'x' + svg.clientHeight;
  startWatch();

  document.getElementById('reset').addEventListener('click', function(){
    state = {}; save();
    var cbs = document.querySelectorAll('.check');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
    popClose(); buildMap(); paint();
  });

  paint();
  setInterval(paint, 30000);
})();
</script>
