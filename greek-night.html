<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>Greek Night</title>
<style>
  :root{
    --bg:#0b0d10; --card:#14181d; --card2:#1b2127; --line:#262d35;
    --ink:#f2f4f6; --ink2:#a9b2bc; --ink3:#6b7682;
    --accent:#f5b84a; --ok:#4fd18b; --now:#5aa9ff;
    --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem;
    --r:1rem; --r2:.6rem;
    --t1:1.6rem; --t2:1.05rem; --t3:.92rem; --t4:.78rem;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:max(var(--s4),env(safe-area-inset-top)) var(--s4) calc(var(--s6) + env(safe-area-inset-bottom))}
  header{padding:var(--s3) 0 var(--s4)}
  header h1{font-size:var(--t1);letter-spacing:-.02em;font-weight:700}
  header p{color:var(--ink2);font-size:var(--t3);margin-top:var(--s1)}
  .meta{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:var(--s1) var(--s3);font-size:var(--t4);color:var(--ink2)}
  .chip b{color:var(--ink);font-weight:600}
  .chip.now{border-color:var(--now);color:var(--now)}
  section{margin-top:var(--s5)}
  section h2{font-size:var(--t4);text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin-bottom:var(--s3);display:flex;justify-content:space-between;align-items:baseline}
  section h2 span{letter-spacing:0;text-transform:none;color:var(--ink3)}
  .list{display:flex;flex-direction:column;gap:var(--s2)}
  .item{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s3) var(--s3) var(--s3);position:relative;transition:opacity .2s}
  .item.now,.item.linked{border-color:var(--now);box-shadow:0 0 0 1px var(--now) inset}
  .item.done{opacity:.42}
  .item.done .title{text-decoration:line-through}
  .check{appearance:none;-webkit-appearance:none;width:1.6rem;height:1.6rem;border-radius:50%;border:2px solid var(--ink3);margin-top:.1rem;flex:none;display:grid;place-items:center;cursor:pointer}
  .check:checked{background:var(--ok);border-color:var(--ok)}
  .check:checked::after{content:"";width:.5rem;height:.85rem;border:solid #0b0d10;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-10%,-15%)}
  .check.num::after{content:attr(data-n);font-size:var(--t4);font-weight:700;line-height:1;color:var(--ink2);font-variant-numeric:tabular-nums}
  .check.num.key-now::after{color:var(--now)}
  .check.num.key-acc::after{color:var(--accent)}
  .check.num:checked::after{content:attr(data-n);width:auto;height:auto;border:0;transform:none;color:#0b0d10}
  .body{min-width:0}
  .time{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:var(--t4);letter-spacing:.04em}
  .item.now .time,.item.linked .time{color:var(--now)}
  .title{font-size:var(--t2);font-weight:600;margin-top:.1rem}
  .note{color:var(--ink2);font-size:var(--t3);margin-top:var(--s1)}
  .map{flex:none;display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:var(--r2);background:var(--card2);border:1px solid var(--line);text-decoration:none;font-size:1.1rem;margin-top:.05rem;color:var(--ink2)}
  .map:active{background:var(--line)}
  .bring .item{grid-template-columns:auto 1fr}
  .bring .title{font-size:var(--t3);font-weight:500;margin-top:.15rem}
  .actions{display:flex;gap:var(--s2);margin-top:var(--s5)}
  button{flex:1;background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:var(--r2);padding:var(--s3);font:inherit;font-size:var(--t3)}
  footer{margin-top:var(--s6);text-align:center;color:var(--ink3);font-size:var(--t4)}
  .mapcard{position:relative;width:100%;aspect-ratio:4/3;max-height:60vh;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .mapcard svg{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .mapchip{position:absolute;top:var(--s3);left:var(--s3);z-index:3;pointer-events:none}
  .gn-land{fill:#ece6d8}
  .gn-campus{fill:#dfe6d3}
  .gn-st-case{stroke:rgba(0,0,0,.10);stroke-width:3;stroke-linecap:round}
  .gn-st{stroke:#fff;stroke-width:1.5;stroke-linecap:round}
  .gn-st-l{font-size:9px;fill:#8b8578;stroke:#ece6d8;stroke-width:3;paint-order:stroke;stroke-linejoin:round;font-weight:500}
  .gn-route-case{fill:none;stroke:#fff;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
  .gn-route{fill:none;stroke:var(--now);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
  .gn-route.ret{stroke-dasharray:8 6;opacity:.7}
  .pin-l{font-size:9px;fill:#6f6a5f;stroke:#ece6d8;stroke-width:3;paint-order:stroke;stroke-linejoin:round;font-weight:600}
  .walk-b{fill:#fff;stroke:var(--line);stroke-width:1}
  .walk-t{font-size:9px;font-weight:700;fill:var(--ink3)}
  .walk.ret{opacity:.7}
  .pin{cursor:pointer;transition:opacity .2s}
  .pin.done{opacity:.45}
  .pin-c{fill:var(--now);stroke:#fff;stroke-width:2}
  .pin.greek .pin-c{fill:var(--accent)}
  .pin-n{fill:#fff;font-size:10px;font-weight:700;pointer-events:none}
  .pin.greek .pin-n{fill:#0b0d10}
  .pin-hit{fill:transparent}
  .pulse{display:none;fill:none;stroke:var(--now);stroke-width:2;transform-box:fill-box;transform-origin:center}
  .pin.now .pulse{display:block;animation:gnPulse 2s ease-out infinite}
  @keyframes gnPulse{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){.pin.now .pulse{animation:none;transform:scale(1.6);opacity:.6}}
  .pinpop{position:absolute;z-index:4;min-width:168px;max-width:230px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);box-shadow:0 8px 26px rgba(0,0,0,.45);font-size:var(--t4);line-height:1.35;transform:translate(-50%,-100%)}
  .pinpop.below{transform:translate(-50%,0)}
  .pinpop .pp{display:flex;align-items:center;gap:var(--s2);color:inherit;text-decoration:none}
  .pinpop .pp-t{flex:1;min-width:0}
  .pinpop b{display:block;font-size:var(--t3);font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinpop .pp-m{display:block;margin-top:2px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  .pinpop .pp-c{flex:none;font-size:1.4rem;line-height:1;color:var(--ink3)}
</style>
</head>
<body>
<header>
  <h1>Greek Night</h1>
  <p>Jack Johnson + G. Love · Thu Oct 1 2026 · Berkeley</p>
  <div class="meta">
    <span class="chip">Doors <b>5:00</b></span>
    <span class="chip">Show <b>6:30</b></span>
    <span class="chip">Julia's <b>5:00</b> ×2</span>
    <span class="chip now" id="clock">—</span>
  </div>
</header>

<div class="mapcard" id="mapcard">
  <span class="chip mapchip">BART from Civic Center · 35 min</span>
  <svg id="gnmap" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Route map"></svg>
  <div class="pinpop" id="pinpop" hidden></div>
</div>

<section>
  <h2>Plan <span id="progress"></span></h2>
  <div class="list" id="plan"></div>
</section>

<section class="bring">
  <h2>Bring</h2>
  <div class="list" id="bring"></div>
</section>

<div class="actions">
  <button id="reset">Reset checks</button>
</div>

<footer>Greek Night · v1</footer>

<script>
(function(){
  'use strict';
  var M = function(q){ return 'https://maps.apple.com/?q=' + encodeURIComponent(q); };

  var PLAN = [
    {t:'2:30', h:14, m:30, title:'Leave Grove St', note:'Uber to Civic Center BART (bus is fine, Uber buys you the Campanile).', map:M('Civic Center BART Station San Francisco')},
    {t:'2:50', h:14, m:50, title:'Red line → Richmond', note:'Sit on the right side for the bay coming out of the tube. ~35 min.', map:M('Civic Center BART Station San Francisco')},
    {t:'3:25', h:15, m:25, title:'Downtown Berkeley BART', note:'Exit to Shattuck, east on Center St two blocks to campus.', map:M('Downtown Berkeley BART Station')},
    {t:'3:30', h:15, m:30, title:'Doe Library', note:'Through the west gate, straight ahead. No ID needed. North Reading Room (the vaulted one, green lamps) and Morrison Library (wood-panelled, couches, records) — both just inside the entrance. Whisper.', map:M('Doe Memorial Library UC Berkeley')},
    {t:'3:55', h:15, m:55, title:'Campanile', note:'Elevator’s likely closed by now — the lawn at the base is the view. 10 min.', map:M('Sather Tower UC Berkeley')},
    {t:'4:10', h:16, m:10, title:'Caffe Strada', note:'Exit campus at the SE corner (Bancroft & College). The patio under the trees. Tea or espresso.', map:M('Caffe Strada 2300 College Ave Berkeley')},
    {t:'4:30', h:16, m:30, title:'Telegraph Ave', note:'West on Bancroft, south on Telegraph. Amoeba and Moe’s. 15 min.', map:M('Amoeba Music 2455 Telegraph Ave Berkeley')},
    {t:'4:50', h:16, m:50, title:'Berkeley City Club', note:'North to Durant, two blocks west. Julia Morgan, 1929 — courtyard and indoor pool through the back. Julia’s is 2nd floor.', map:M('Berkeley City Club 2315 Durant Ave Berkeley')},
    {t:'5:00', h:17, m:0, title:'Dinner — Julia’s', note:'Table for 2. Zero-proof cocktails. Niçoise w/ trout, ratatouille, beet salad. Ask for the check by 6:10.', map:M('Julia’s Restaurant 2315 Durant Ave Berkeley')},
    {t:'6:15', h:18, m:15, title:'Walk to the Greek', note:'Durant east → College Ave north → Gayley Rd. 15 min, uphill at the end.', map:M('Greek Theatre 2001 Gayley Rd Berkeley')},
    {t:'6:35', h:18, m:35, title:'In the gate', note:'G. Love on. Jack ~8:00. Done ~10:15. GA pit — standing, front of stage. Water refill on the middle concourse.', map:M('Greek Theatre 2001 Gayley Rd Berkeley')},
    {t:'10:15', h:22, m:15, title:'Home', note:'Walk down to Downtown Berkeley BART (15 min). Red line → Civic Center → Uber.', map:M('Downtown Berkeley BART Station')}
  ];

  var BRING = [
    'Hoodie / jacket — mid-50s after dark',
    'Comfortable shoes — pit is standing, 6:30 to 10:15',
    'Small blanket (under 40×60) — only if you want the lawn for the back half',
    'Empty water bottle',
    'Small bag only — no bag check, everything searched',
    'Sunscreen for 5–7pm, bowl faces west',
    'Phone charged · Clipper in Wallet · tickets in Wallet'
  ];

  var KEY = 'greek-night-v2';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var planEl = document.getElementById('plan');
  var bringEl = document.getElementById('bring');
  var progEl = document.getElementById('progress');
  var clockEl = document.getElementById('clock');

  function row(id, time, title, note, map){
    var el = document.createElement('label');
    el.className = 'item';
    el.dataset.id = id;
    var cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'check'; cb.checked = !!state[id];
    if (id.charAt(0) === 'p') { cb.classList.add('num'); cb.setAttribute('data-n', +id.slice(1) + 1); }
    cb.addEventListener('change', function(){ state[id] = cb.checked; save(); paint(); });
    var body = document.createElement('div'); body.className = 'body';
    if (time) { var tt = document.createElement('div'); tt.className = 'time'; tt.textContent = time; body.appendChild(tt); }
    var ti = document.createElement('div'); ti.className = 'title'; ti.textContent = title; body.appendChild(ti);
    if (note) { var nn = document.createElement('div'); nn.className = 'note'; nn.textContent = note; body.appendChild(nn); }
    el.appendChild(cb); el.appendChild(body);
    if (map) {
      var a = document.createElement('a'); a.className = 'map'; a.href = map; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '↗'; a.setAttribute('aria-label', 'Apple Maps');
      a.addEventListener('click', function(ev){ ev.stopPropagation(); });
      el.appendChild(a);
    }
    return el;
  }

  PLAN.forEach(function(p, i){ planEl.appendChild(row('p' + i, p.t, p.title, p.note, p.map)); });
  BRING.forEach(function(b, i){ bringEl.appendChild(row('b' + i, '', b, '', '')); });

  function nowIndex(){
    var d = new Date();
    if (d.getMonth() !== 9 || d.getDate() !== 1) return -1;
    var mins = d.getHours() * 60 + d.getMinutes();
    var idx = -1;
    PLAN.forEach(function(p, i){ if (mins >= p.h * 60 + p.m) idx = i; });
    return idx;
  }

  function paint(){
    var done = 0;
    var ni = nowIndex();
    var rows = planEl.children;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var checked = !!state['p' + i];
      r.classList.toggle('done', checked);
      r.classList.toggle('now', i === ni && !checked);
      if (checked) done++;
    }
    var brows = bringEl.children;
    for (var j = 0; j < brows.length; j++) brows[j].classList.toggle('done', !!state['b' + j]);
    progEl.textContent = done + ' / ' + PLAN.length;
    var d = new Date();
    var hh = d.getHours() % 12 || 12, mm = ('0' + d.getMinutes()).slice(-2);
    clockEl.textContent = 'Now ' + hh + ':' + mm + (d.getHours() < 12 ? ' am' : ' pm');
    paintMap(ni);
  }

  /* ---------- map hero: offline SVG, projected from the data ---------- */
  var PLACES = [
    {n:'Downtown Berkeley BART', lat:37.8699, lng:-122.2681, step:3},
    {n:'Doe Library', lat:37.8723, lng:-122.2592, step:4},
    {n:'Campanile', lat:37.8721, lng:-122.2578, step:5},
    {n:'Caffe Strada', lat:37.8688, lng:-122.2533, step:6},
    {n:'Amoeba / Moe’s', lat:37.8657, lng:-122.2587, step:7},
    {n:'Berkeley City Club', lat:37.8678, lng:-122.2612, step:8},
    {n:'Greek Theatre', lat:37.8737, lng:-122.2543, step:11, greek:true}
  ];
  /* walk out: BART → campus → Strada → Telegraph → City Club → Greek; the Bancroft & College retrace is the same sidewalk */
  var OUT = [
    [37.8699, -122.2681], [37.8702, -122.2662], [37.8718, -122.2640], [37.8723, -122.2592],
    [37.8721, -122.2578], [37.8700, -122.2555], [37.8687, -122.2535], [37.8688, -122.2533],
    [37.8687, -122.2588], [37.8657, -122.2587], [37.8677, -122.2588], [37.8678, -122.2612],
    [37.8677, -122.2535], [37.8687, -122.2535], [37.8705, -122.2545], [37.8737, -122.2543]
  ];
  var BACK = [[37.8737, -122.2543], [37.8723, -122.2592], [37.8718, -122.2640], [37.8702, -122.2662], [37.8699, -122.2681]];
  /* [name, N–S?, fixed coord, from, to (null = full fitted width), labelled] */
  var STREETS = [
    ['Shattuck Ave', true, -122.2682, 37.863, 37.878, true],
    ['Oxford St', true, -122.2662, 37.866, 37.876, true],
    ['Telegraph Ave', true, -122.2588, 37.860, 37.8687, true],
    ['College Ave', true, -122.2535, 37.860, 37.8745, true],
    ['Durant Ave', false, 37.8677, null, null, true],
    ['Bancroft Way', false, 37.8687, null, null, false],
    ['Haste St', false, 37.8658, -122.270, -122.250, false],
    ['Hearst Ave', false, 37.8747, -122.270, -122.250, false],
    ['Center St', false, 37.8702, -122.270, -122.2662, false],
    ['Gayley Rd', true, -122.2545, 37.8705, 37.876, false]
  ];
  /* walk time per leg: haversine along the waypoints, 3 mph (20 min/mile); the climb to the Greek at 2.5 mph */
  function metres(a, b){
    var R = 6371000, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dg = (b[1] - a[1]) * r;
    var x = Math.sin(dl / 2) * Math.sin(dl / 2) + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dg / 2) * Math.sin(dg / 2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function walkLegs(){
    var legs = [], k = 0, prev = 0;
    PLACES.forEach(function(pl, i){
      while (k < OUT.length && !(OUT[k][0] === pl.lat && OUT[k][1] === pl.lng)) k++;
      if (i > 0) legs.push({pts:OUT.slice(prev, k + 1), mph:pl.greek ? 2.5 : 3});
      prev = k;
    });
    /* the return's pill sits on its visible dashed stretch (Greek → Doe), on the side away from the Campanile */
    legs.push({pts:BACK, mph:3, ret:true, place:BACK.slice(0, 2), away:PLACES.filter(function(pl){ return pl.step === 5; })[0]});
    legs.forEach(function(l){
      var m = 0;
      for (var j = 1; j < l.pts.length; j++) m += metres(l.pts[j - 1], l.pts[j]);
      l.min = Math.round(m / 1609.344 / l.mph * 60);
    });
    return legs;
  }
  var LEGS = walkLegs();
  var CAMPUS = [[37.8687, -122.2662], [37.8687, -122.2545], [37.8755, -122.2545], [37.8755, -122.2662]];
  var K = Math.cos(37.87 * Math.PI / 180);
  var NS = 'http://www.w3.org/2000/svg';
  var cardEl = document.getElementById('mapcard');
  var svg = document.getElementById('gnmap');
  var popEl = document.getElementById('pinpop');
  var chipEl = cardEl.querySelector('.mapchip');
  var pinEls = [], linkedRow = null;
  /* plan rows with a pin take the pin's colour for their step number */
  PLACES.forEach(function(s){ planEl.children[s.step - 1].querySelector('.check').classList.add(s.greek ? 'key-acc' : 'key-now'); });

  function S(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function popPill(href, name, meta){
    return '<a class="pp" href="' + esc(href) + '" target="_blank" rel="noopener"><span class="pp-t"><b>' + name + '</b><span class="pp-m">' + meta + '</span></span><span class="pp-c">›</span></a>';
  }
  function f(n){ return n.toFixed(1); }

  /* label collision: a candidate box scores 0 only when it is inside the map and clear of pins, route, chip and other labels */
  function segHitsRect(a, b, r){
    var t0 = 0, t1 = 1, dx = b[0] - a[0], dy = b[1] - a[1];
    var p = [-dx, dx, -dy, dy], q = [a[0] - r.x, r.x + r.w - a[0], a[1] - r.y, r.y + r.h - a[1]];
    for (var i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return false; continue; }
      var t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
      else { if (t < t0) return false; if (t < t1) t1 = t; }
    }
    return true;
  }
  function rectsHit(a, b){ return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
  function scoreBox(r, ob, w, h){
    var s = 0;
    if (r.x < 3 || r.y < 3 || r.x + r.w > w - 3 || r.y + r.h > h - 3) s += 100;
    ob.circles.forEach(function(c){
      var nx = Math.max(r.x, Math.min(c[0], r.x + r.w)), ny = Math.max(r.y, Math.min(c[1], r.y + r.h));
      if ((nx - c[0]) * (nx - c[0]) + (ny - c[1]) * (ny - c[1]) < c[2] * c[2]) s += 10;
    });
    var R = {x:r.x - 4.5, y:r.y - 4.5, w:r.w + 9, h:r.h + 9};   /* route casing half-width 3.5 + 1 */
    ob.segs.forEach(function(sg){ if (segHitsRect(sg[0], sg[1], R)) s += 10; });
    ob.rects.forEach(function(o){ if (rectsHit(r, o)) s += 10; });
    return s;
  }

  function buildMap(){
    var w = svg.clientWidth, h = svg.clientHeight;
    if (!w || !h) return;
    var minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
    PLACES.forEach(function(s){
      var x = s.lng * K, y = -s.lat;
      minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y);
    });
    var sc = Math.min(w * 0.84 / (maxx - minx), h * 0.84 / (maxy - miny));
    var ox = w / 2 - sc * (minx + maxx) / 2, oy = h / 2 - sc * (miny + maxy) / 2;
    function P(lat, lng){ return [ox + sc * lng * K, oy - sc * lat]; }

    svg.textContent = '';
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    var defs = S('defs', {}, svg);
    var flt = S('filter', {id:'gn-soft', x:'-10%', y:'-10%', width:'120%', height:'120%'}, defs);
    S('feGaussianBlur', {stdDeviation:'3'}, flt);
    S('rect', {'class':'gn-land', x:0, y:0, width:w, height:h}, svg);
    S('polygon', {'class':'gn-campus', filter:'url(#gn-soft)', points:CAMPUS.map(function(c){ var p = P(c[0], c[1]); return f(p[0]) + ',' + f(p[1]); }).join(' ')}, svg);

    var gs = S('g', {}, svg);
    var lines = STREETS.map(function(st){
      var a, b;
      if (st[1]) { a = P(st[3], st[2]); b = P(st[4], st[2]); }
      else if (st[3] === null) { var y = P(st[2], 0)[1]; a = [0, y]; b = [w, y]; }
      else { a = P(st[2], st[3]); b = P(st[2], st[4]); }
      var ln = {x1:f(a[0]), y1:f(a[1]), x2:f(b[0]), y2:f(b[1])};
      ln['class'] = 'gn-st-case'; S('line', ln, gs);
      ln['class'] = 'gn-st'; S('line', ln, gs);
      return [a, b];
    });

    function routeD(pts){ return pts.map(function(c, k){ var p = P(c[0], c[1]); return (k ? 'L' : 'M') + f(p[0]) + ' ' + f(p[1]); }).join(''); }
    var dOut = routeD(OUT), dBack = routeD(BACK);
    S('path', {'class':'gn-route-case', d:dBack}, svg);
    S('path', {'class':'gn-route ret', d:dBack}, svg);
    S('path', {'class':'gn-route-case', d:dOut}, svg);
    S('path', {'class':'gn-route', d:dOut}, svg);

    /* obstacles for label placement */
    var ob = {circles:[], segs:[], rects:[]};
    PLACES.forEach(function(s){ var p = P(s.lat, s.lng); ob.circles.push([p[0], p[1], 12]); });
    [OUT, BACK].forEach(function(pts){
      for (var i = 1; i < pts.length; i++) ob.segs.push([P(pts[i - 1][0], pts[i - 1][1]), P(pts[i][0], pts[i][1])]);
    });
    var cr = chipEl.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    ob.rects.push({x:cr.left - sr.left - 2, y:cr.top - sr.top - 2, w:cr.width + 4, h:cr.height + 4});

    var gl = S('g', {}, svg);
    function measure(cls, txt){
      var t = S('text', {'class':cls, x:-999, y:-999}, gl); t.textContent = txt;
      var len = t.getComputedTextLength(); gl.removeChild(t); return len;
    }
    function best(cands){
      var pick = null, ps = Infinity;
      cands.forEach(function(c){ var s = scoreBox(c.r, ob, w, h); if (s < ps) { ps = s; pick = c; } });
      return {c:pick, s:ps};
    }

    /* pin names: right of the pin (left in the right third), then the other side, then above / below */
    PLACES.forEach(function(s){
      var p = P(s.lat, s.lng), len = measure('pin-l', s.n), H = 10;
      var R = {r:{x:p[0] + 13, y:p[1] - 5, w:len, h:H}, anchor:'start', x:p[0] + 13};
      var L = {r:{x:p[0] - 13 - len, y:p[1] - 5, w:len, h:H}, anchor:'end', x:p[0] - 13};
      var cands = p[0] > w * 2 / 3 ? [L, R] : [R, L];
      [p[1] - 15, p[1] + 5].forEach(function(y){
        cands.push({r:{x:p[0] + 11, y:y, w:len, h:H}, anchor:'start', x:p[0] + 11});
        cands.push({r:{x:p[0] - 11 - len, y:y, w:len, h:H}, anchor:'end', x:p[0] - 11});
      });
      [p[1] - 13 - H, p[1] + 13, p[1] - 22 - H, p[1] + 22].forEach(function(y){
        cands.push({r:{x:p[0] - len / 2, y:y, w:len, h:H}, anchor:'middle', x:p[0]});
        cands.push({r:{x:p[0] + 8, y:y, w:len, h:H}, anchor:'start', x:p[0] + 8});
        cands.push({r:{x:p[0] - 8 - len, y:y, w:len, h:H}, anchor:'end', x:p[0] - 8});
      });
      var bb = best(cands), b = bb.c;
      if (bb.s > 0) {
        /* crowded corner: take the nearest clear spot close to the pin instead */
        var near = null, nd = Infinity;
        for (var dy = -36; dy <= 26; dy++) for (var dx = -len - 36; dx <= 36; dx++) {
          var r = {x:p[0] + dx, y:p[1] + dy, w:len, h:H};
          var qx = Math.max(r.x, Math.min(p[0], r.x + r.w)) - p[0], qy = Math.max(r.y, Math.min(p[1], r.y + r.h)) - p[1];
          var d = Math.sqrt(qx * qx + qy * qy);
          if (d < nd && scoreBox(r, ob, w, h) === 0) { nd = d; near = r; }
        }
        if (near) b = {r:near, anchor:'start', x:near.x};
      }
      var t = S('text', {'class':'pin-l', x:f(b.x), y:f(b.r.y + 8), 'text-anchor':b.anchor}, gl);
      t.textContent = s.n;
      ob.rects.push(b.r);
    });

    /* walk-time pills: beside the leg at its midpoint along the line, either side, sliding along it if crowded */
    LEGS.forEach(function(l){
      var txt = l.min + ' min' + (l.ret ? ' ⇣' : ''), pw = measure('walk-t', txt) + 10, ph = 13;
      var pts = (l.place || l.pts).map(function(c){ return P(c[0], c[1]); }), cum = [0];
      for (var j = 1; j < pts.length; j++) cum.push(cum[j - 1] + Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]));
      function at(fr){
        var d = cum[cum.length - 1] * fr, j = 1;
        while (j < pts.length - 1 && cum[j] < d) j++;
        var a = pts[j - 1], b = pts[j], sl = (cum[j] - cum[j - 1]) || 1, t = (d - cum[j - 1]) / sl;
        return {x:a[0] + (b[0] - a[0]) * t, y:a[1] + (b[1] - a[1]) * t, nx:-(b[1] - a[1]) / sl, ny:(b[0] - a[0]) / sl};
      }
      /* side +1 / -1 of the line; a leg with `away` prefers the side away from that pin */
      var m = at(0.5), sides = [1, -1];
      if (l.away) { var ap = P(l.away.lat, l.away.lng); var sa = (ap[0] - m.x) * m.nx + (ap[1] - m.y) * m.ny > 0 ? -1 : 1; sides = [sa, -sa]; }
      function beside(sd){
        var cands = [];
        [0.5, 0.4, 0.6, 0.3, 0.7, 0.2, 0.8].forEach(function(fr){
          var q = at(fr), ext = Math.abs(q.nx) * pw / 2 + Math.abs(q.ny) * ph / 2;
          [10, 16].forEach(function(off){
            var cx = q.x + sd * q.nx * (off + ext), cy = q.y + sd * q.ny * (off + ext);
            cands.push({r:{x:cx - pw / 2, y:cy - ph / 2, w:pw, h:ph}});
          });
        });
        return cands;
      }
      /* crowded: nearest clear spot to the leg's midpoint, on side sd (0 = either) */
      function nearest(sd){
        var near = null, nd = Infinity;
        for (var dy = -40; dy <= 40; dy++) for (var dx = -40; dx <= 40; dx++) {
          if (sd && (dx * m.nx + dy * m.ny) * sd <= 0) continue;
          var r = {x:m.x + dx - pw / 2, y:m.y + dy - ph / 2, w:pw, h:ph}, d = Math.hypot(dx, dy);
          if (d < nd && scoreBox(r, ob, w, h) === 0) { nd = d; near = r; }
        }
        return near && {r:near};
      }
      var c = null, all = [];
      if (l.away) {
        var bw = best(beside(sides[0]));
        c = bw.s === 0 ? bw.c : nearest(sides[0]);
      }
      if (!c) {
        sides.forEach(function(sd){ all = all.concat(beside(sd)); });
        var ba = best(all);
        c = ba.s === 0 ? ba.c : (nearest(0) || ba.c);
      }
      var g = S('g', {'class':'walk' + (l.ret ? ' ret' : '')}, gl);
      S('rect', {'class':'walk-b', x:f(c.r.x), y:f(c.r.y), width:f(pw), height:ph, rx:ph / 2}, g);
      S('text', {'class':'walk-t', x:f(c.r.x + pw / 2), y:f(c.r.y + 9.5), 'text-anchor':'middle'}, g).textContent = txt;
      ob.rects.push(c.r);
    });

    /* street names: beside the line on its visible part; a street with no clear spot goes unlabelled rather than under the route */
    STREETS.forEach(function(st, i){
      if (!st[5]) return;
      var a = lines[i][0], b = lines[i][1], len = measure('gn-st-l', st[0]), cands = [];
      [0.7, 0.5, 0.85, 0.3, 0.15, 0.6, 0.4, 0.95, 0.05].forEach(function(fr){
        if (st[1]) {
          var y0 = Math.min(h - 6, Math.max(a[1], b[1])), y1 = Math.max(6, Math.min(a[1], b[1]));
          var ly = y0 - (y0 - y1) * fr, x = a[0];
          cands.push({r:{x:x + 6, y:ly - len / 2, w:10, h:len}, x:x, y:ly, dy:'15', rot:true});
          cands.push({r:{x:x - 16, y:ly - len / 2, w:10, h:len}, x:x, y:ly, dy:'-7', rot:true});
        } else {
          var x0 = Math.max(6, Math.min(a[0], b[0])), x1 = Math.min(w - 6, Math.max(a[0], b[0]));
          var lx = x0 + (x1 - x0) * fr - len / 2, yy = a[1];
          cands.push({r:{x:lx, y:yy - 16, w:len, h:10}, x:lx, y:yy, dy:'-8'});
          cands.push({r:{x:lx, y:yy + 6, w:len, h:10}, x:lx, y:yy, dy:'15'});
        }
      });
      var r = best(cands);
      if (r.s > 0) return;
      var c = r.c, at = {'class':'gn-st-l', x:f(c.x), y:f(c.y), dy:c.dy};
      if (c.rot) { at['text-anchor'] = 'middle'; at.transform = 'rotate(-90 ' + f(c.x) + ' ' + f(c.y) + ')'; }
      S('text', at, gl).textContent = st[0];
      ob.rects.push(c.r);
    });

    pinEls = PLACES.map(function(s, i){
      var p = P(s.lat, s.lng);
      var g = S('g', {'class':'pin' + (s.greek ? ' greek' : ''), 'data-i':i, transform:'translate(' + f(p[0]) + ' ' + f(p[1]) + ')'}, svg);
      S('circle', {'class':'pin-hit', r:20}, g);
      S('circle', {'class':'pulse', r:9}, g);
      S('circle', {'class':'pin-c', r:9}, g);
      var n = S('text', {'class':'pin-n', 'text-anchor':'middle', dy:'3.5'}, g);
      n.textContent = s.step;
      return g;
    });
  }

  function paintMap(ni){
    pinEls.forEach(function(g, i){
      var k = PLACES[i].step - 1;
      g.classList.toggle('done', !!state['p' + k]);
      g.classList.toggle('now', k === ni && !state['p' + k]);
    });
  }

  function popClose(){
    popEl.hidden = true; popEl.innerHTML = '';
    if (linkedRow) { linkedRow.classList.remove('linked'); linkedRow = null; }
  }
  function popOpen(i){
    var s = PLACES[i], p = PLAN[s.step - 1];
    popEl.innerHTML = popPill(p.map, esc(s.n), 'step ' + s.step + ' · ' + esc(p.t));
    popEl.hidden = false;
    if (linkedRow) linkedRow.classList.remove('linked');
    linkedRow = planEl.children[s.step - 1];
    linkedRow.classList.add('linked');
    var c = pinEls[i].querySelector('.pin-c').getBoundingClientRect(), r = cardEl.getBoundingClientRect();
    var cx = c.left + c.width / 2 - r.left, top = c.top - r.top, bot = c.bottom - r.top;
    var pw = popEl.offsetWidth, ph = popEl.offsetHeight;
    var below = top - 8 - ph < 4;
    popEl.classList.toggle('below', below);
    popEl.style.left = Math.max(pw / 2 + 8, Math.min(r.width - pw / 2 - 8, cx)) + 'px';
    popEl.style.top = (below ? bot + 8 : top - 8) + 'px';
  }

  svg.addEventListener('click', function(ev){
    var g = ev.target.closest ? ev.target.closest('.pin') : null;
    if (g) popOpen(+g.getAttribute('data-i')); else popClose();
  });
  var rsT = null, lastW = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rsT);
    rsT = setTimeout(function(){
      if (svg.clientWidth + 'x' + svg.clientHeight === lastW) return;
      lastW = svg.clientWidth + 'x' + svg.clientHeight; popClose(); buildMap(); paint();
    }, 150);
  });
  buildMap(); lastW = svg.clientWidth + 'x' + svg.clientHeight;

  document.getElementById('reset').addEventListener('click', function(){
    state = {}; save();
    var cbs = document.querySelectorAll('.check');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
    paint();
  });

  paint();
  setInterval(paint, 30000);
})();
</script>
</body>
</html>
